<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astro Synapse design</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,800,900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* The main page (index.html) is built by build.py from build.json. Page chrome uses the Astro Synapse tokens. */
:root {
  --background: 40 33% 97%; --foreground: 233 36% 6%; --card: 40 40% 99%; --muted: 38 25% 92%;
  --muted-foreground: 228 12% 42%; --border: 36 18% 86%; --primary: 173 80% 30%; --primary-foreground: 0 0% 100%;
  --brand-cyan: 173 80% 32%; --brand-violet: 253 75% 58%; --brand-magenta: 283 70% 50%; --brand-gold: 40 85% 40%; --accent: 38 28% 90%;
  --code-bg: 40 30% 94%;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --background: 230 43% 3%; --foreground: 0 0% 100%; --card: 233 36% 7%; --muted: 232 24% 14%;
  --muted-foreground: 228 12% 78%; --border: 240 4% 26%; --primary: 170 85% 72%; --primary-foreground: 230 43% 3%;
  --brand-cyan: 170 85% 72%; --brand-violet: 253 100% 71%; --brand-magenta: 283 100% 71%; --brand-gold: 44 82% 71%; --accent: 232 24% 16%;
  --code-bg: 233 36% 5%;
} }
:root[data-theme="dark"] {
  --background: 230 43% 3%; --foreground: 0 0% 100%; --card: 233 36% 7%; --muted: 232 24% 14%;
  --muted-foreground: 228 12% 78%; --border: 240 4% 26%; --primary: 170 85% 72%; --primary-foreground: 230 43% 3%;
  --brand-cyan: 170 85% 72%; --brand-violet: 253 100% 71%; --brand-magenta: 283 100% 71%; --brand-gold: 44 82% 71%; --accent: 232 24% 16%;
  --code-bg: 233 36% 5%;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 128px; }
body { margin: 0; background: hsl(var(--background)); color: hsl(var(--foreground)); font: 15px/1.6 Inter, system-ui, sans-serif; }
a { color: inherit; }
code { font: 13px "IBM Plex Mono", ui-monospace, monospace; background: hsl(var(--muted)); padding: 1px 5px; border-radius: 4px; }
button { font: inherit; color: inherit; }

/* Top bar + sub-nav */
.top { position: sticky; top: 0; z-index: 30; background: hsl(var(--background) / .88); backdrop-filter: blur(12px); border-bottom: 1px solid hsl(var(--border)); }
.bar { display: flex; align-items: center; gap: 20px; height: 60px; padding: 0 24px; }
.brand { font: 800 18px Satoshi, Inter, sans-serif; letter-spacing: -.01em; white-space: nowrap; text-decoration: none;
  background: linear-gradient(90deg, hsl(var(--brand-cyan)), hsl(var(--brand-violet)), hsl(var(--brand-magenta))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; color: hsl(var(--muted-foreground)); font: 600 14px Satoshi, Inter, sans-serif; padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: baseline; }
.tab small { font: 500 11px "IBM Plex Mono", monospace; opacity: .75; }
.tab:hover { color: hsl(var(--foreground)); }
a.tab { text-decoration: none; }
.tab[aria-selected="true"] { background: hsl(var(--muted)); color: hsl(var(--foreground)); }
.search { margin-left: auto; position: relative; width: min(320px, 34vw); }
.search input { width: 100%; height: 36px; border-radius: 999px; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); color: inherit; font: 14px Inter, sans-serif; padding: 0 38px 0 36px; outline: none; }
.search input:focus { border-color: hsl(var(--brand-cyan)); }
.search svg { position: absolute; left: 12px; top: 10px; width: 16px; height: 16px; stroke: hsl(var(--muted-foreground)); fill: none; stroke-width: 2; }
.search kbd { position: absolute; right: 11px; top: 8px; font: 11px "IBM Plex Mono", monospace; color: hsl(var(--muted-foreground)); border: 1px solid hsl(var(--border)); border-radius: 4px; padding: 1px 6px; }
.icon-btn { width: 36px; height: 36px; flex: none; border-radius: 999px; border: 1px solid hsl(var(--border)); background: none; cursor: pointer; display: grid; place-items: center; }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.subnav { display: flex; gap: 2px; padding: 0 24px; height: 44px; align-items: stretch; overflow-x: auto; scrollbar-width: none; }
.subnav a { display: flex; align-items: center; gap: 8px; padding: 0 14px; text-decoration: none; font: 600 14px Satoshi, Inter, sans-serif; color: hsl(var(--muted-foreground)); border-bottom: 2px solid transparent; white-space: nowrap; }
.subnav a:hover { color: hsl(var(--foreground)); }
.subnav a[aria-current="page"] { color: hsl(var(--foreground)); border-bottom-color: hsl(var(--brand-cyan)); }
.subnav a.is-empty { opacity: .45; }
.subnav a.item { margin: 7px 0; padding: 0 12px; border: 0; border-radius: 999px; gap: 6px; }
.subnav a.item small { font: 500 10px "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.subnav a.item[aria-current="true"] { background: hsl(var(--muted)); color: hsl(var(--foreground)); }
.subnav .sep { flex: none; width: 1px; margin: 11px 8px; background: hsl(var(--border)); }
.subnav .count { font: 500 11px "IBM Plex Mono", monospace; color: hsl(var(--muted-foreground)); background: hsl(var(--muted)); border-radius: 999px; padding: 0 7px; }

/* Shell */
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); }
.side { position: sticky; top: 105px; height: calc(100vh - 105px); overflow: auto; padding: 24px 12px 48px 24px; border-right: 1px solid hsl(var(--border)); }
.side h4 { font: 500 11px "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: hsl(var(--muted-foreground)); margin: 20px 10px 8px; }
.side h4:first-child { margin-top: 0; }
.side a { display: block; text-decoration: none; padding: 5px 10px; border-radius: 8px; color: hsl(var(--muted-foreground)); font-size: 14px; line-height: 1.4; }
.side a.sub { padding-left: 22px; font-size: 13px; }
.side a:hover { color: hsl(var(--foreground)); background: hsl(var(--muted) / .6); }
.side a.active { color: hsl(var(--foreground)); background: hsl(var(--muted)); box-shadow: inset 2px 0 0 hsl(var(--brand-cyan)); }
.main { padding: 36px 48px 120px; max-width: 1240px; min-width: 0; }
.intro { margin-bottom: 32px; }
.intro .eyebrow, .eyebrow { font: 500 11px "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: hsl(var(--brand-cyan)); }
.intro h1 { font: 800 38px/1.08 Satoshi, Inter, sans-serif; letter-spacing: -.025em; margin: 8px 0 10px; }
.intro p, .lede { color: hsl(var(--muted-foreground)); margin: 0; max-width: 72ch; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
.chip { font: 500 11px "IBM Plex Mono", monospace; color: hsl(var(--muted-foreground)); border: 1px solid hsl(var(--border)); border-radius: 999px; padding: 2px 9px; text-decoration: none; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
a.chip:hover { color: hsl(var(--foreground)); border-color: hsl(var(--brand-cyan)); }
.chip--warn { color: hsl(5 85% 60%); border-color: hsl(5 85% 60% / .5); }
.chip--wire { color: hsl(var(--brand-gold)); border-color: hsl(var(--brand-gold) / .5); }

/* Cards */
.card { border: 1px solid hsl(var(--border)); border-radius: 16px; background: hsl(var(--card)); margin-bottom: 28px; overflow: hidden; }
.card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 22px 28px 0; }
.card-head h2 { font: 800 23px/1.2 Satoshi, Inter, sans-serif; letter-spacing: -.015em; margin: 0; }
.part { padding: 20px 28px; }
.part + .part { border-top: 1px solid hsl(var(--border) / .7); }
.part-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
.label { font: 500 11px "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: hsl(var(--brand-cyan)); }
.rules { margin: 0; padding-left: 20px; }
.rules li { margin: 4px 0; }
.rules li::marker { color: hsl(var(--brand-cyan)); }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy { display: inline-flex; align-items: center; gap: 6px; border: 1px solid hsl(var(--border)); background: hsl(var(--background)); color: hsl(var(--muted-foreground)); border-radius: 8px; padding: 5px 10px; font: 500 12px Inter, sans-serif; cursor: pointer; }
.copy:hover { color: hsl(var(--foreground)); border-color: hsl(var(--brand-cyan)); }
.copy svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
.copy.done { color: hsl(var(--brand-cyan)); border-color: hsl(var(--brand-cyan)); }
.seg { display: inline-flex; background: hsl(var(--muted)); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; color: hsl(var(--muted-foreground)); font: 600 12px Inter, sans-serif; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: hsl(var(--card)); color: hsl(var(--foreground)); box-shadow: 0 1px 2px hsl(0 0% 0% / .15); }
pre { margin: 0; background: hsl(var(--code-bg)); border: 1px solid hsl(var(--border) / .7); border-radius: 12px; padding: 16px 18px; overflow: auto; max-height: 520px; font: 12.5px/1.6 "IBM Plex Mono", ui-monospace, monospace; }
.j-key { color: hsl(var(--brand-violet)); } .j-str { color: hsl(var(--brand-cyan)); } .j-num { color: hsl(var(--brand-magenta)); } .j-pun { color: hsl(var(--muted-foreground)); }
.err { color: hsl(5 85% 60%); font-size: 13px; margin: 8px 0 0; }
.stage { border-radius: 12px; overflow: hidden; border: 1px solid hsl(var(--border) / .7); background: hsl(var(--background)); display: flex; justify-content: center; }
.stage iframe { border: 0; width: 100%; display: block; background: transparent; }
.stage.mobile iframe { width: 390px; border-inline: 1px solid hsl(var(--border)); }
.note { color: hsl(var(--muted-foreground)); font-size: 13px; margin: 10px 0 0; }
/* Components page: cards span the content area, and the layout preview spans the card */
.main.main--wide { max-width: none; }
.part.part--layout { padding-left: 0; padding-right: 0; padding-bottom: 0; }
.part--layout .part-head, .part--layout .note { padding-left: 28px; padding-right: 28px; }
.part--layout .note { padding-bottom: 16px; }
.part--layout .stage { border-radius: 0; border-width: 1px 0 0; }
.shared { border-left: 2px solid hsl(var(--brand-cyan)); padding: 4px 0 4px 20px; margin-bottom: 32px; }
.shared h2 { font: 800 20px Satoshi, Inter, sans-serif; margin: 0 0 8px; }
.empty { color: hsl(var(--muted-foreground)); border: 1px dashed hsl(var(--border)); border-radius: 16px; padding: 40px 28px; text-align: center; }
.empty h2 { font: 800 22px Satoshi, Inter, sans-serif; color: hsl(var(--foreground)); margin: 0 0 6px; }

/* Prose (design, content, readme) */
.prose { max-width: 78ch; }
.prose h1 { font: 800 32px/1.1 Satoshi, Inter, sans-serif; letter-spacing: -.02em; margin: 0 0 12px; }
.prose h2 { font: 800 24px/1.2 Satoshi, Inter, sans-serif; letter-spacing: -.015em; margin: 40px 0 10px; }
.prose h3 { font: 700 18px/1.3 Satoshi, Inter, sans-serif; margin: 28px 0 8px; }
.prose h4 { font: 700 15px Satoshi, Inter, sans-serif; margin: 20px 0 6px; }
.prose p, .prose li { color: hsl(var(--foreground) / .88); }
.prose ul, .prose ol { padding-left: 22px; } .prose li::marker { color: hsl(var(--brand-cyan)); }
.prose blockquote { margin: 16px 0; padding: 12px 16px; border-left: 2px solid hsl(var(--brand-violet)); background: hsl(var(--muted) / .5); border-radius: 0 10px 10px 0; color: hsl(var(--muted-foreground)); }
.prose hr { border: 0; border-top: 1px solid hsl(var(--border)); margin: 28px 0; }
.tablewrap { overflow-x: auto; }
.prose table, .tok-table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 12px 0; }
.prose th, .prose td, .tok-table th, .tok-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid hsl(var(--border)); vertical-align: top; }
.prose th, .tok-table th { font: 500 11px "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: hsl(var(--muted-foreground)); }

/* Design blocks */
.dsec { margin-bottom: 44px; }
.dsec > h2 { font: 800 26px/1.2 Satoshi, Inter, sans-serif; letter-spacing: -.015em; margin: 0 0 10px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
.sw { border: 1px solid hsl(var(--border)); border-radius: 12px; overflow: hidden; background: hsl(var(--card)); }
.sw i { display: block; height: 64px; border-bottom: 1px solid hsl(var(--border)); }
.sw div { padding: 8px 10px 10px; font-size: 12px; line-height: 1.4; }
.sw b { display: block; font: 500 12px "IBM Plex Mono", monospace; }
.sw span { color: hsl(var(--muted-foreground)); font: 11px "IBM Plex Mono", monospace; display: block; }
.sw em { font-style: normal; color: hsl(var(--muted-foreground)); display: block; margin-top: 4px; }
.mode-bar { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.type-row { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-bottom: 1px solid hsl(var(--border)); align-items: baseline; }
.type-row .meta-col { font: 12px/1.5 "IBM Plex Mono", monospace; color: hsl(var(--muted-foreground)); }
.type-row .meta-col b { display: block; font: 700 14px Satoshi, Inter, sans-serif; color: hsl(var(--foreground)); margin-bottom: 4px; }
.type-row .sample { overflow-wrap: anywhere; line-height: 1.15; }
.scale-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 14px; }
.scale { border: 1px solid hsl(var(--border)); border-radius: 12px; padding: 14px 16px; background: hsl(var(--card)); }
.scale h4 { margin: 0 0 10px; }
.scale-row { display: grid; grid-template-columns: 100px 70px 1fr; gap: 10px; align-items: center; font: 12px "IBM Plex Mono", monospace; padding: 4px 0; }
.scale-row span { color: hsl(var(--muted-foreground)); }
.scale-row i { display: block; height: 10px; background: hsl(var(--brand-cyan)); border-radius: 2px; }
.scale-row i.r { width: 32px; height: 32px; background: hsl(var(--muted)); border: 2px solid hsl(var(--brand-cyan)); }

/* Layout flows */
.flow { margin-bottom: 48px; }
.flow > h2 { font: 800 28px/1.15 Satoshi, Inter, sans-serif; letter-spacing: -.02em; margin: 0 0 8px; }
.step { border: 1px solid hsl(var(--border)); border-radius: 16px; background: hsl(var(--card)); margin: 18px 0; overflow: hidden; }
.step-head { padding: 18px 24px 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.step-head h3 { font: 800 18px Satoshi, Inter, sans-serif; margin: 0; }
.chat { display: flex; justify-content: flex-end; padding: 14px 24px 0; }
.bubble { max-width: min(560px, 90%); background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); padding: 10px 16px; border-radius: 18px 18px 4px 18px; font-size: 14.5px; }
.bubble em { opacity: .85; }
.why { padding: 10px 24px 0; color: hsl(var(--muted-foreground)); font-size: 14px; }
.why b { color: hsl(var(--foreground)); font-weight: 600; }
.comp-chips { padding: 10px 24px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.step .part { padding: 16px 24px; }
details.json > summary { cursor: pointer; font: 500 12px "IBM Plex Mono", monospace; color: hsl(var(--muted-foreground)); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.json > summary::before { content: "▸"; } details.json[open] > summary::before { content: "▾"; }
details.json pre { margin-top: 10px; }

/* Prototype */
.proto { border: 1px solid hsl(var(--border)); border-radius: 16px; overflow: hidden; background: hsl(var(--card)); }
.proto-bar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid hsl(var(--border)); flex-wrap: wrap; }
.proto-bar .icon-btn { width: 32px; height: 32px; }
.proto-bar .icon-btn:disabled { opacity: .35; cursor: default; }
.addr { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: hsl(var(--muted)); font: 13px "IBM Plex Mono", monospace; color: hsl(var(--muted-foreground)); overflow: hidden; white-space: nowrap; }
.addr b { color: hsl(var(--foreground)); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.proto-stage { display: flex; justify-content: center; background: hsl(var(--background)); }
.proto-stage iframe { border: 0; width: 100%; height: calc(100vh - 290px); min-height: 520px; display: block; }
.proto-stage.mobile iframe { width: 390px; border-inline: 1px solid hsl(var(--border)); }
/* A classic-site prototype fills the content area: sidebar to the right edge, sub-nav line to the bottom */
.main.main--bleed { padding: 0; max-width: none; }
.main--bleed .proto { display: flex; flex-direction: column; height: calc(100vh - 105px); height: calc(100dvh - 105px); border: 0; border-radius: 0; }
.main--bleed .proto-stage { flex: 1; min-height: 0; }
.main--bleed .proto-stage iframe { height: 100%; min-height: 0; }
.main--bleed .proto-bar { flex-wrap: nowrap; }
a.icon-btn { color: inherit; text-decoration: none; }
.side a.proto-link { display: flex; flex-direction: column; gap: 1px; }
.side a.proto-link small { font: 11px "IBM Plex Mono", monospace; color: hsl(var(--muted-foreground)); opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.results .res { display: block; text-decoration: none; padding: 14px 18px; border: 1px solid hsl(var(--border)); border-radius: 12px; margin-bottom: 10px; background: hsl(var(--card)); }
.results .res:hover { border-color: hsl(var(--brand-cyan)); }
.results .res b { font: 700 16px Satoshi, Inter, sans-serif; }
.results .res p { margin: 4px 0 0; color: hsl(var(--muted-foreground)); font-size: 13px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .25s; background: hsl(var(--foreground)); color: hsl(var(--background)); border-radius: 12px; padding: 10px 16px; font: 13px Inter, sans-serif; max-width: 90vw; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast b { font-family: "IBM Plex Mono", monospace; font-weight: 500; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; } .side { display: none; }
  .main { padding: 24px 16px 80px; } .bar { gap: 10px; padding: 0 16px; } .brand { display: none; }
  .subnav { padding: 0 8px; } .search { width: auto; flex: 1; min-width: 120px; }
  .part--layout .part-head, .part--layout .note { padding-left: 16px; padding-right: 16px; }
  .part, .card-head, .step .part, .step-head, .chat, .why, .comp-chips { padding-left: 16px; padding-right: 16px; }
  .type-row { grid-template-columns: 1fr; gap: 6px; }
  html { scroll-padding-top: 116px; } .side { top: 105px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="#/">Astro Synapse design</a>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search everything…" autocomplete="off"><kbd>/</kbd></label>
    <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
  </div>
  <nav class="subnav" id="subnav" aria-label="Project items and pages"></nav>
</header>

<script>// Preview renderers for the Astro website template (templates/website/components.md).
// Markup is ported from the live site (webagen.astrosynapse.ai/website), captured by rendering each
// spec example there, so classes and structure match. Styles: astro-base.css plus utilities
// generated by twlite.py from the classes in this file (keep class lists literal, or in tw`…`).
// Clicks: data-prompt = sends a query · data-href = navigates · data-action = static frontend action.
(function () {
  const R = (window.WEBAGEN_RENDERERS = window.WEBAGEN_RENDERERS || {});
  const tw = (s) => s.raw.join("");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const img = (id, w, h) => (/^https?:\/\//.test(id) ? id : `https://images.unsplash.com/${id}?auto=format&fit=crop&crop=faces&w=${w}&h=${h}&q=70`);
  const pad = (n, w = 2) => String(n).padStart(w, "0");
  const words = (s) => String(s || "").trim().split(/\s+/);
  const list = (v) => (Array.isArray(v) ? v : typeof v === "string" && v ? v.split(",").map((x) => x.trim()).filter(Boolean) : []);
  const P = (s) => (s ? ` data-prompt="${esc(s)}"` : "");
  const H = (s) => (s ? ` data-href="${esc(s)}"` : "");

  /* Tabler icons (paths inline; the live site uses @tabler/icons-react) */
  const svg = (cls, paths) => `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${paths.map((d) => `<path d="${d}"/>`).join("")}</svg>`;
  const I = {
    right: (c) => svg(c, ["M5 12l14 0", "M13 18l6 -6", "M13 6l6 6"]),
    left: (c) => svg(c, ["M5 12l14 0", "M5 12l6 6", "M5 12l6 -6"]),
    down: (c) => svg(c, ["M12 5l0 14", "M18 13l-6 6", "M6 13l6 6"]),
    plus: (c) => svg(c, ["M12 5l0 14", "M5 12l14 0"]),
    linkedin: (c) => svg(c, ["M8 11v5", "M8 8v.01", "M12 16v-5", "M16 16v-3a2 2 0 1 0 -4 0", "M3 7a4 4 0 0 1 4 -4h10a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-10a4 4 0 0 1 -4 -4z"]),
    x: (c) => svg(c, ["M4 4l11.733 16h4.267l-11.733 -16z", "M4 20l6.768 -6.768m2.46 -2.46l6.772 -6.772"]),
    github: (c) => svg(c, ["M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5"]),
  };

  /* Shared pieces (same classes as the live site) */
  const BTN = tw`inline-flex min-h-12 items-center justify-center gap-2 rounded-full border px-6 py-3 text-sm font-bold tracking-tight transition-all duration-200 ease-out border-transparent bg-foreground text-background hover:-translate-y-0.5 hover:astro-glow`;

  const PILL = tw`inline-flex min-h-6 max-w-full items-center break-words rounded-full border border-brand-cyan/20 px-2.5 py-0.5 font-plex-mono text-xs uppercase tracking-wider text-brand-cyan`;

  const STATUS = tw`inline-flex min-h-6 shrink-0 items-center whitespace-nowrap rounded-full border border-foreground/30 bg-background/50 px-2.5 py-0.5 font-plex-mono text-xs uppercase tracking-widest text-foreground`;

  // bullet lists: the spec allows them, the live site doesn't render them yet; drawn in the same style
  const bullets = (items) => `<ul class="mb-6 flex w-full max-w-xl flex-col">${items.map((x) => `<li class="${NUM_LI}"><span class="astro-dot-glow absolute left-1 top-5 h-1.5 w-1.5 rounded-full bg-brand-cyan"></span>${esc(x.text ?? x)}</li>`).join("")}</ul>`;
  const CONTAINER = tw`container px-4 sm:px-6 md:px-12`;
  const H2 = tw`text-foreground max-w-full break-words font-inter text-4xl font-semibold leading-tight tracking-tighter sm:text-5xl md:text-6xl`;
  const LEAD = tw`max-w-2xl break-words text-base leading-normal text-foreground/70 sm:text-lg md:text-xl`;
  const def = (name, render, extra = {}) => { R[name] = Object.assign({
    theme: "astro", rootClass: "astro-st-scope", bg: "hsl(var(--background))",
    htmlClass: (mode) => (mode === "dark" ? "dark " : "") + "font-satoshi",
    fonts: ["https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap", "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"],
    render: (p) => `<section class="flex flex-col">${render(p || {})}</section>`,
  }, extra); };

  /* ---------- 1. Landing heading ---------- */
  def("astro-landing-heading", (p) => {
    const ctas = p.ctas || [];
    const marquee = list(p.marquee ?? p.marquees);
    const loop = marquee.length ? Array.from({ length: Math.max(2, Math.ceil(8 / marquee.length)) * 2 }, (_, k) => marquee[k % marquee.length]) : [];

      <h1 class="text-foreground mb-5 max-w-full break-words font-inter text-4xl font-semibold leading-tight tracking-tighter sm:mb-6 sm:text-5xl sm:leading-none md:text-7xl lg:text-8xl">${esc(p["main-heading"])}</h1>

      ${ctas.length ? `<div class="flex flex-wrap items-center gap-x-6 gap-y-4">${ctas.map((c, i) => i === 0
        ? `<div>${button(c.label, c["data-prompt"], c.href)}</div>`
        : `<div><a href="#"${P(c["data-prompt"])}${H(c.href)} class="group inline-flex items-center gap-3 font-plex-mono text-xs uppercase tracking-widest text-muted-foreground transition-colors hover:text-brand-cyan motion-safe:animate-bounce-y"><span class="grid h-9 w-9 place-items-center rounded-full border border-foreground/30">${I.down("tabler-icon h-4 w-4")}</span><span>${esc(c.label)}</span></a></div>`).join("")}</div>` : ""}
    </div></div>
    ${loop.length ? `<div class="relative w-full overflow-hidden border-y border-foreground/10 bg-foreground/5 py-4"><div class="wa-marquee flex w-max">${[0, 1].map(() => `<div class="flex shrink-0">${loop.map((m, i) => `<div class="flex shrink-0 items-center gap-6 pr-6 sm:gap-10 sm:pr-10"><span class="whitespace-nowrap font-inter text-2xl font-medium tracking-tighter sm:text-3xl md:text-5xl ${i % 2 ? "astro-text-outline" : "text-foreground"}">${esc(m)}</span><span class="text-base text-brand-cyan sm:text-xl md:text-2xl">✦</span></div>`).join("")}</div>`).join("")}</div></div>` : ""}
    </div>`;

  /* ---------- 2. Services ---------- */
  def("astro-services-heading", (p) => `<div class="${CONTAINER} flex flex-col py-16">

      : `<div class="ch-tiles ch-${t.length}">${t.map((x) => `<figure><img src="${img(x.image, 900, 675)}" alt="" loading="lazy"><figcaption>${esc(x.caption)}</figcaption></figure>`).join("")}</div>`;
    return `<section class="chapter"><div class="container"><div class="ch-head"><div class="eyebrow">${esc(p.eyebrow)}</div><h2 class="display">${esc(p.title)}</h2><p class="lead">${esc(p.text)}</p></div>${body}</div></section>`;

  def("stride-specs", (p) => `<section class="chapter"><div class="container"><div class="ch-head"><div class="eyebrow">${esc(p.eyebrow || "Specifications")}</div><h2 class="display">${esc(p.title)}</h2></div><div class="spec-cols">${specTables(p.specs)}</div>${(p["in-the-box"] || []).length ? `<div class="inbox"><div class="eyebrow">In the box</div><ol>${p["in-the-box"].map((i) => `<li>${esc(i)}</li>`).join("")}</ol></div>` : ""}</div></section>`);

  def("stride-faq", (p) => `<section class="chapter"><div class="container"><div class="ch-head"><div class="eyebrow">${esc(p.eyebrow || "Questions")}</div><h2 class="display">${esc(p.title)}</h2></div><div class="acc faq">${(p.items || []).map((q, i) => `<details ${i === 0 ? "open" : ""}><summary>${esc(q.q)}</summary><div class="acc-body"><p>${esc(q.a)}</p></div></details>`).join("")}</div></div></section>`);

  def("stride-final-cta", (p) => `<section class="chapter s-final"><div class="container"><div class="ch-head"><div class="eyebrow">${esc(p.eyebrow)}</div><h2 class="display">${esc(p.title)}</h2><p class="lead">${esc(p.text)}</p><div class="sg-row"><a class="btn btn-primary btn-lg" href="#" data-anchor="${esc(p.cta?.anchor || "")}">${esc(p.cta?.label)}</a><span class="small muted">${esc(p.note || "")}</span></div></div></div></section>`);

  def("stride-press", (p) => `<section class="section press"><div class="container"><div class="press-row">${(p.quotes || []).map((q) => `<blockquote><p>“${esc(q.quote)}”</p><cite>${esc(q.source)}</cite></blockquote>`).join("")}</div></div></section>`);

  def("stride-brand-strip", (p) => `<section class="section brands"><div class="container"><div class="brand-row">${(p.brands || []).map((b) => `<span>${esc(b)}</span>`).join("")}</div></div></section>`);

  def("stride-trust", (p) => `<section class="section"><div class="container"><div class="trust">${(p.items || []).map((t) => `<div>${icon(t.icon)}<b>${esc(t.title)}</b><span>${esc(t.text)}</span></div>`).join("")}</div></div></section>`);

  /* ---------- cart & checkout ---------- */
  def("stride-cart", (p) => {
    if (p.variant === "empty") return `<div class="drawer is-static"><aside class="panel" style="height:auto"><header><b>Your bag · 0</b><button class="icon-btn"${A("Close bag")} aria-label="Close">✕</button></header><div class="body"><div class="empty"><p class="h3">${esc(p.title)}</p><p class="muted">${esc(p.text)}</p><a class="btn btn-primary" href="#"${P(p.cta?.["data-prompt"])}>${esc(p.cta?.label)}</a></div></div></aside></div>`;
    const lines = p.lines || [];
    const count = lines.reduce((a, l) => a + (l.qty || 0), 0);
    const toFree = Math.max(0, (p["free-shipping-over"] || 0) - p.subtotal);
    const w = p["free-shipping-over"] ? Math.min(100, (100 * p.subtotal) / p["free-shipping-over"]) : 100;
    return `<div class="drawer is-static"><aside class="panel"><header><b>Your bag · ${count}</b><button class="icon-btn"${A("Close bag")} aria-label="Close">✕</button></header>
      <div class="body"><div class="progress">${toFree > 0 ? `<span>You're <b>${money(toFree)}</b> away from free shipping</span>` : "<span><b>Free shipping</b> unlocked</span>"}<i style="--w:${w}%"></i></div>${lines.map((l) => lineItem(l, true)).join("")}</div>
      <footer>${totals(p)}<button class="btn btn-primary btn-lg btn-block"${A("Checkout")}>Checkout</button><button class="btn btn-express btn-block"${A("Apple Pay")}> Pay</button><div class="small muted" style="text-align:center">Guest checkout · no account needed</div></footer></aside></div>`;
  });

  def("stride-checkout", (p) => { const d = p.delivery || []; return `<div class="container checkout"><div class="co-head"><a class="logo" href="#"${P("Show the homepage")}>${esc(p.store || "Stride")}</a><div class="steps"><div class="is-active">Information</div><div>Shipping</div><div>Payment</div></div></div>
    <div class="co-body"><form class="co-form" onsubmit="return false">
     <section class="co-sec"><h2 class="h3">Express checkout</h2><div class="express"><button type="button" class="btn btn-express"${A("Apple Pay")}> Pay</button><button type="button" class="btn btn-express"${A("Google Pay")}>G Pay</button><button type="button" class="btn btn-express"${A("PayPal")}>PayPal</button></div><div class="or"><span>or continue as guest</span></div></section>
     <section class="co-sec"><h2 class="h3">Contact</h2><div class="field"><label>Email</label><input class="input" type="email" placeholder="you@example.com" data-local><span class="hint">Order updates only. No account needed; you can create one after paying.</span></div></section>
     <section class="co-sec"><h2 class="h3">Delivery address</h2><div class="co-grid">
      <div class="field"><label>First name</label><input class="input" data-local></div><div class="field"><label>Last name</label><input class="input" data-local></div>
      <div class="field span2"><label>Street and number</label><input class="input" data-local></div>
      <div class="field"><label>Postcode</label><input class="input" data-local></div><div class="field"><label>City</label><input class="input" data-local></div>
      <div class="field span2"><label>Country</label><select class="select" data-local>${(p.countries || []).map((c) => `<option>${esc(c)}</option>`).join("")}</select></div></div>
      <h2 class="h3" style="margin-top:var(--s-5)">Delivery method</h2><div class="radios">${d.map((m, i) => `<label class="radio"><input type="radio" name="ship" data-local ${i === 0 ? "checked" : ""}><div><b>${esc(m.label)}</b><span>${esc(m.note)}</span></div><b class="num">${m.price ? money(m.price) : "Free"}</b></label>`).join("")}</div></section>
     <section class="co-sec"><h2 class="h3">Payment</h2><div class="co-grid"><div class="field span2"><label>Card number</label><input class="input" placeholder="1234 1234 1234 1234" data-local></div><div class="field"><label>Expiry</label><input class="input" placeholder="MM / YY" data-local></div><div class="field"><label>CVC</label><input class="input" placeholder="123" data-local></div></div>
      <div class="co-submit"><button class="btn btn-primary btn-lg btn-block"${A("Pay")}>Pay ${money(p.total)}</button><p class="small muted" style="text-align:center;margin:10px 0 0">Encrypted · 30-day returns · prices include VAT</p></div></section></form>
    <aside class="co-summary"><details class="co-sum-toggle" open><summary><b>Order summary</b><span class="num">${money(p.total)}</span></summary><div>${(p.lines || []).map((l) => lineItem(l, false)).join("")}<div style="margin-top:12px">${totals(p)}</div><div class="paylogos" style="margin-top:14px">${(p.payments || []).map((x) => `<span>${esc(x)}</span>`).join("")}</div></div></details></aside></div></div>`; });

  def("stride-order-confirmation", (p) => { let eta = p.eta; try { eta = new Date(p.eta).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }); } catch (e) {} return `<div class="container plp"><div class="order"><div class="eyebrow">Order #${esc(p.order)}</div><h1 class="h1">Thanks, ${esc(p["first-name"])}. It's on its way soon.</h1><p class="lead">Confirmation sent to <b>${esc(p.email)}</b>. Expected delivery by <b>${esc(eta)}</b> to ${esc(p.address)}.</p>
    <div class="order-box">${(p.lines || []).map((l) => lineItem(l, false)).join("")}<div style="margin-top:12px">${totals({ ...p, vat: null }, p.method === "express" ? "Paid with express checkout" : "Paid")}</div></div>
    <div class="order-next"><div><b>Create an account?</b><p class="small muted" style="margin:4px 0 10px">Track this order and reorder in one tap. Optional.</p><button class="btn btn-outline btn-sm"${A("Create account")}>Create account</button></div><div><b>Changed your mind?</b><p class="small muted" style="margin:4px 0 10px">30-day free returns, prepaid label in the box.</p><a class="btn btn-ghost btn-sm" href="#"${P(p["data-prompt"])}>Continue shopping</a></div></div></div></div>`; });

  def("stride-toast", (p) => `<div style="padding:var(--s-5) 0"><div class="toast is-static"><span>${esc(p.message)}</span>${p.action ? `<button class="btn btn-sm" style="background:var(--bg);color:var(--fg)"${P(p.action["data-prompt"])}>${esc(p.action.label)}</button>` : ""}</div></div>`);
  /* ---------- design page: live UI kit ---------- */
  def("stride-kit", () => {

    const sample = { title: "Aero Run 2", subtitle: "Neutral road running shoe", price: 139, "compare-at": 169, image: "photo-1542291026-7eec264c27ff", "hover-image": "photo-1597892657493-6847b9640bac", badges: ["sale", "bestseller"], rating: { avg: 4.7, count: 183 }, swatches: ["#d6341f", "#f1efe9", "#7c7f86"], "data-prompt": "Show product Aero Run 2" };
    const sample2 = { title: "Merino run sock 3-pack", subtitle: "Cushioned ankle sock", price: 29, image: "photo-1773665230184-5fd8cb4fc928", badges: ["bestseller", "low-stock"], rating: { avg: 4.8, count: 530 }, swatches: [], "data-prompt": "Show product Merino run sock 3-pack" };
    return `<div class="annc">Free shipping over €75 · 30-day free returns · VAT included</div>
    <div class="container kit">

        <div class="kit-row"><button class="btn btn-primary"${A("Primary")}>Add to bag</button><button class="btn btn-secondary"${A("Secondary")}>View collection</button><button class="btn btn-outline"${A("Outline")}>Compare</button><button class="btn btn-ghost"${A("Ghost")}>Size guide</button><button class="btn btn-primary" disabled>Sold out</button></div>
        <div class="kit-row"><button class="btn btn-primary btn-lg"${A("Large")}>Checkout · €189,00</button><button class="btn btn-outline btn-sm"${A("Small")}>Quick view</button><button class="btn btn-express"${A("Express")}> Pay</button><button class="btn btn-express"${A("Express")}>G Pay</button><button class="btn btn-express"${A("Express")}>PayPal</button></div></section>
      <section>${h("02 · Forms", "Inputs and filters")}
        <div class="kit-2"><div class="kit-col"><div class="field"><label>Email</label><input class="input" type="email" value="ana@example.com" data-local></div><div class="field"><label>Country</label><select class="select" data-local><option>Croatia</option><option>Slovenia</option></select></div><div class="field"><label>Postcode</label><input class="input is-invalid" value="1000" data-local><span class="hint is-error">Postcodes in Croatia have 5 digits, e.g. 10000.</span></div></div>
        <div class="kit-col"><div class="search">${ICON.search}<input class="input" placeholder="Search products, e.g. trail running 42" data-local></div><label class="check"><input type="checkbox" checked data-local> EU 42 <span class="cnt">18</span></label><label class="check"><input type="checkbox" data-local> Waterproof <span class="cnt">7</span></label><div class="applied"><span class="pill is-active">EU 42 <span class="x">×</span></span><span class="pill is-active">Under €150 <span class="x">×</span></span><button class="btn btn-ghost btn-sm"${A("Clear all")}>Clear all</button></div></div></div></section>
      <section>${h("03 · Signals", "Badges, ratings, stock and options")}
        <div class="kit-row"><span class="badge badge-new">New</span><span class="badge badge-sale">−18%</span><span class="badge badge-low">Low stock</span><span class="badge badge-out">Sold out</span><span class="badge badge-ok">Ships today</span><span class="badge badge-soft">Best seller</span></div>
        <div class="kit-row">${rating({ avg: 4.6, count: 212 })}<span class="stock">In stock</span><span class="stock is-low">Only 2 left in EU 43</span><span class="stock is-out">Sold out · notify me</span></div>
        <div class="kit-row"><div class="price price-lg"><span class="now is-sale">€139,00</span><span class="was">€169,00</span></div><div class="swatches"><button class="swatch is-active" style="--c:#d6341f" data-local></button><button class="swatch" style="--c:#f1efe9" data-local></button><button class="swatch is-out" style="--c:#7c7f86" data-local></button></div></div>
        <div class="variants"><button class="variant" data-local>40</button><button class="variant" data-local>41</button><button class="variant is-active" data-local>42</button><button class="variant is-low" data-local>43</button><button class="variant is-out" data-local>44</button><button class="variant" data-local>45</button></div></section>
      <section>${h("04 · Navigation", "Chips, breadcrumbs and section heads")}
        <nav class="crumbs"><a href="#"${P("Show the homepage")}>Home</a> › <a href="#"${P("Show category Running")}>Running</a> › <span>Road</span></nav>
        <div class="chips subcats" style="margin:12px 0"><a class="pill is-active" href="#">All</a><a class="pill" href="#"${P("Show category Road")}>Road</a><a class="pill" href="#"${P("Show category Trail")}>Trail</a><a class="pill" href="#"${P("Show category Track")}>Track</a></div>
        ${head("Best sellers", "View all", "Show all best sellers")}</section>
      <section>${h("05 · Graphics", "Cards, tiles and photo treatment")}
        <div class="kit-cards"><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${card(sample)}${card(sample2)}</div>${tiles([{ label: "Running", image: "photo-1590333748338-d629e4564ad9", "data-prompt": "Show category Running" }, { label: "Outdoor", image: "photo-1600100315778-850119b19220", "data-prompt": "Show category Outdoor" }])}</div>
        <div class="trust" style="margin-top:24px">${[["truck", "Free shipping over €75", "2–4 working days, EU-wide"], ["arrow-back-up", "30-day returns", "Prepaid label in the box"], ["shield-check", "2-year warranty", "On every pair of shoes"], ["map-pin", "Shipped from Zagreb", "Same-day dispatch by 14:00"]].map(([i, t, x]) => `<div>${icon(i)}<b>${t}</b><span>${x}</span></div>`).join("")}</div></section>
    </div>`;
  }, { css: `.kit{display:grid;gap:40px;padding-block:28px 40px}.kit-h{margin-bottom:14px}.kit-h .h2{margin:4px 0 0}.kit-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
     .kit-2{display:grid;gap:24px}@media(min-width:760px){.kit-2{grid-template-columns:1fr 1fr}}.kit-col{display:grid;gap:12px;align-content:start}
     .kit-cards{display:grid;gap:16px}@media(min-width:760px){.kit-cards{grid-template-columns:1.2fr 1fr;align-items:start}.kit-cards .tiles{grid-template-columns:1fr 1fr}}` });
})();
</script>

const DATA = {"title": "Astro Synapse design", "projects": [{"id": "webagen", "title": "webAgen", "items": [{"id": "website-template", "type": "template", "title": "Website · Astro", "label": "Website", "brand": "Astro", "path": "webagen.astrosynapse.ai/templates/website", "description": "A company website the agent builds as the visitor asks questions: services, products, use cases, team and contact. Demo company: Korvane Silicon, a fictional fabless chip design house.", "readme": "<p>A company website the agent builds as the visitor asks questions: services, products, use cases, team and contact. Demo company: Korvane Silicon, a fictional fabless chip design house.<\/p>\n<ul><li><code>design.md<\/code> — colours, type, spacing, graphics and UI elements (dark-first, cyan accent, Satoshi)<\/li><li><code>components.md<\/code> — the sections the agent composes layouts from (ruleset + JSON), prefix <code>astro-<\/code><\/li><li><code>content.md<\/code> — default web content: the Korvane company document the agent answers from<\/li><li><code>prototype/<\/code> — the full website as a classic multi-page site (HTML, <code>styles.css<\/code>, <code>main.js<\/code>, images); the main page shows it. The contact form has no action and sends nothing<\/li><li><code>layouts/<\/code> — example flows: what the agent sends back, step by step, for typical visitor journeys<\/li><li><code>prompts/<\/code> — AI instructions specific to this template (empty for now)<\/li><\/ul>\n<p>Live preview: webagen.astrosynapse.ai/website<\/p>", "design": {"title": "Astro design", "source": "webagen.astrosynapse.ai/templates/website/design.md", "intro": "<p>The look of the Astro website template, as shipped on webagen.astrosynapse.ai/website: a near-black ground, warm off-white type and a bright cyan accent, with a violet-to-magenta gradient reserved for the brand. Every component reads these tokens as <code>hsl(var(--token))<\/code>; none hard-code a colour.<\/p>", "sections": [{"id": "principles", "title": "Principles", "html": "<ul><li>Dark first. The site opens in dark mode; light mode uses the same accent on a warm off-white<\/li><li>Cyan is the only action colour: primary buttons, links, eyebrows and focus rings<\/li><li>The gradient (cyan → violet → magenta) belongs to the brand wordmark and soft background glows, never to text you read or to buttons<\/li><li>Big, tight headings: Inter semibold with tight tracking for headings, Satoshi for body text, IBM Plex Mono for small uppercase labels<\/li><li>Space over boxes: sections breathe on the dotted grid; cards appear only when items need to be compared<\/li><\/ul>", "blocks": [], "kit": null}, {"id": "colour", "title": "Colour", "html": "", "blocks": [{"kind": "colors", "data": {"modes": {"dark": {"--background": "hsl(230 43% 3%)", "--foreground": "hsl(39 39% 93%)", "--card": "hsl(233 36% 4%)", "--muted": "hsl(232 28% 9%)", "--muted-foreground": "hsl(228 13% 60%)", "--border": "hsl(240 4% 14%)", "--primary": "hsl(170 85% 72%)", "--primary-foreground": "hsl(230 43% 3%)", "--brand-cyan": "hsl(170 85% 72%)", "--brand-violet": "hsl(253 100% 71%)", "--brand-magenta": "hsl(283 100% 71%)", "--brand-gold": "hsl(44 82% 71%)", "--accent": "hsl(232 24% 12%)"}, "light": {"--background": "hsl(40 33% 97%)", "--foreground": "hsl(233 36% 6%)", "--card": "hsl(40 40% 99%)", "--muted": "hsl(38 25% 92%)", "--muted-foreground": "hsl(228 12% 42%)", "--border": "hsl(36 18% 86%)", "--primary": "hsl(173 80% 30%)", "--primary-foreground": "hsl(0 0% 100%)", "--brand-cyan": "hsl(173 80% 32%)", "--brand-violet": "hsl(253 75% 58%)", "--brand-magenta": "hsl(283 70% 50%)", "--brand-gold": "hsl(40 85% 40%)", "--accent": "hsl(38 28% 90%)"}}, "usage": {"--background": "Page background", "--foreground": "Headings and body text", "--card": "Cards and panels", "--muted": "Quiet surfaces, inputs, chips", "--muted-foreground": "Secondary text", "--border": "Card borders and dividers", "--primary": "Primary buttons, links, focus", "--primary-f ing\": \"Fabless chip design house building low-power AI, power and sensing chips, and custom silicon for products that have outgrown off-the-shelf parts.\",\n        \"badges\": [\n          { \"label\": \"Efficiency\"},\n          { \"label\": \"Reliability\"},\n          { \"label\": \"Longevity\"}\n        ],\n        \"ctas\": [\n          { \"label\": \"Start a project\", \"href\": \"/contact\", \"data-prompt\": \"\" },\n          { \"label\": \"Explore our chips\", \"href\": \"/products\", \"data-prompt\": \"What chips do you make? Show me your products.\" }\n        ],\n        \"marquee\": [\"Edge AI\", \"Power\", \"Korvane Silicon\"]\n      }\n    }\n  ]\n}\n```\n\n## Astro Services Section\n\n`astro-services-heading`\n\n**Ruleset:**\n\n- Use when asked about the services provided\n- Keep the list-items between min 3 - max 8 items\n- Keep the heading between min 5 - max 8 words\n- Keep the sur-heading to 1 word\n- Keep the list-items title between min 2 - max 8 words\n- Keep the list-items sub-title between min 8 - max 15 words\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-a2\",\n  \"components\": [\n    {\n      \"category\": \"services-section\",\n      \"name\": \"astro-services-heading\",\n      \"props\": {\n        \"heading\": \"From concept to silicon under one roof\",\n        \"sur-heading\": \"capabilities\",\n        \"list-items\": [\n          { \"title\": \"Custom ASIC & SoC Design.\", \"sub-title\": \"RISC-V SoCs · mixed-signal ASICs · spec to tape-out · 22nm to 180nm nodes\"},\n          { \"title\": \"Design Verification & DFT.\", \"sub-title\": \"UVM testbenches · formal verification · FPGA prototyping · scan and BIST insertion\"},\n          { \"title\": \"Analog & Mixed-Signal IP.\", \"sub-title\": \"ADCs · PLLs · LDOs · SerDes · licensable or custom-built for your process\"},\n          { \"title\": \"Packaging & Chiplet Integration.\", \"sub-title\": \"QFN · FCBGA · WLCSP · antenna-in-package · 2.5D chiplets · thermal modeling\"},\n          { \"title\": \"Test, Qualification & Reliability.\", \"sub-title\": \"ATE test programs · AEC-Q100 qualification · HTOL and ESD testing · failure analysis\"},\n          { \"title\": \"Embedded Firmware & SDKs.\", \"sub-title\": \"Bootloaders · drivers · Zephyr RTOS support · model compilers for our accelerators\"},\n          { \"title\": \"Lifecycle & Obsolescence Management.\", \"sub-title\": \"Drop-in replacements for end-of-life parts · 15-year supply · last-time-buy planning\"},\n          { \"title\": \"Engineering Team Augmentation.\", \"sub-title\": \"Embedded silicon, firmware and test engineers · protocol-driven onboarding · VP-level leadership\"}\n        ]\n      }\n    }\n  ]\n}\n```\n\n## Astro Products Section\n\n`astro-products-section`\n\n**Ruleset:**\n\n- Use when asked about the products offered\n- Generate one product-card per product\n- Keep the main-heading between min 4 - max 8 words\n- Keep the sur-heading to 1 word\n- Keep the product-cards title between min 1 - max 3 words\n- Keep the product-cards sub-title between min 5 - max 15 words\n- Keep the product-cards badge between min 1 - max 2 words\n- Keep the product-cards cta between min 1 - max 4 words\n- Keep the pills between min 2 - max 5 items\n- Keep the pills label between min 1 - max 3 words\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-a3\",\n  \"components\": [\n    {\n      \"category\": \"products-section\",\n      \"name\": \"astro-products-section\",\n      \"props\": {\n        \"main-heading\": \"Chips we design and ship ourselves.\",\n        \"sur-heading\": \"Products\",\n        \"product-cards\": [\n          {\n          \"title\": \"Nerva N1\",\n          \"sub-title\": \"Edge AI inference accelerator, 8 TOPS at under one watt\",\n          \"badge\": \"In production\",\n          \"cta\": \"View the datasheet\",\n          \"pills\": [\n            {\"label\": \"8 TOPS\"},\n            {\"label\": \"Sub-1W\"},\n            {\"label\": \"I \n}\n```\n\n## Astro Heading Section\n\n`astro-heading-section`\n\n**Ruleset:**\n\n- Use when conversation switches topics or when context implies emphasis on a topic\n- Keep the heading between min 5 - max 8 words in min 1 - max 2 sentences\n- Keep the sur-heading to max 1 word\n- Keep the sub-text between min 10 - max 40 words\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-a4\",\n  \"components\": [\n    {\n      \"category\": \"heading-section\",\n      \"name\": \"astro-heading-section\",\n      \"props\": {\n        \"heading\": \"Dual-sourced silicon. Supported for fifteen years.\",\n        \"sur-heading\": \"Resilience\",\n        \"sub-text\": \"Every production design is qualified at two foundries and two packaging partners, with at least one site in Europe. Every standard product carries a fifteen-year longevity commitment, so one end-of-life notice never stops your line.\"\n      }\n    }\n  ]\n}\n```\n\n## Astro CTA Section\n\n`astro-cta-section`\n\n**Ruleset:**\n\n- Use when you want to incite the user to act and contact us in some way\n- Keep the heading between min 2 - max 6 words\n- Keep the sur-heading to max 1 word\n- Keep the sub-heading between min 10 - max 20 words\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-a5\",\n  \"components\": [\n    {\n      \"category\": \"cta-section\",\n      \"name\": \"astro-cta-section\",\n      \"props\": {\n        \"heading\": \"Tape out with us.\",\n        \"sur-heading\": \"Collaborate\",\n        \"sub-heading\": \"Tell us what you're building; we'll tell you honestly whether you need custom silicon at all.\"\n      }\n    }\n  ]\n}\n```\n\n## Astro Contact Section\n\n`astro-contact-section`\n\n**Ruleset:**\n\n- Use when you want to provide the user a contact form\n- The contact form needs no props\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-a10\",\n  \"components\": [\n    {\n      \"category\": \"contact-section\",\n      \"name\": \"astro-contact-section\"\n    }\n  ]\n}\n```\n\n## Astro Product Section\n\n`astro-product-section`\n\n**Ruleset:**\n\n- Use to display details about a product\n- Keep the main-heading as the name of the product\n- Keep the badge between min 1 - max 3 words\n- Keep the top-paragraph title between min 5 - max 10 words\n- Keep the top-paragraph text between min 20 - max 50 words\n- Keep the bottom-paragraph title between min 5 - max 10 words\n- Keep the bottom-paragraph text between min 20 - max 50 words\n- The bottom-paragraph is optional, send an empty object when there is nothing to add\n- Use the numbered list for one-line sentences of features, guides, or pain points the product addresses\n- Keep the numbered list text between min 8 - max 12 words\n- Keep the numbered list between min 3 - max 6 items\n- Use the rich list for small titled paragraphs of features or use cases\n- Keep the rich list title between min 1 - max 2 words\n- Keep the rich list text between min 15 - max 30 words\n- Keep the rich list between min 3 - max 5 items\n- Use the labeled list for paragraphs whose first sentence acts as the label\n- Keep the labeled list label between min 2 - max 4 words\n- Keep the labeled list text between min 1 - max 30 words\n- Keep the pills label between min 1 - max 3 words\n- Keep the pills between min 2 - max 5 items\n- Keep the cta between min 1 - max 3 words\n\n**JSON · JSON Variant 1:**\n\n```json\n{\n  \"section_id\": \"section-a5\",\n  \"components\": [\n    {\n      \"category\": \"product-section\",\n      \"name\": \"astro-product-section\",\n      \"props\": {\n        \"main-heading\": \"Nerva N1\",\n        \"badge\": \"In Production\",\n        \"top-paragraph\": {\n          \"title\": \"Run vision AI on the device, not the cloud.\",\n          \"text\": \"Smart cameras and robots need real-time neural networks, but GPUs draw too much power and cloud inference adds latency and privacy risk. Nerva N1 runs vision and audio models locally at 8 TOPS while drawing under one watt.\"\n roduce a 4D point cloud of range, speed, and angle.\"},\n            {\"title\": \"Process\", \"text\": \"An on-chip DSP and RISC-V core run detection algorithms locally, so only results leave the chip, never raw radar data.\"},\n            {\"title\": \"Privacy\", \"text\": \"Radar sees movement, not faces, making it suitable for bathrooms, bedrooms, and care homes where cameras are unacceptable.\"},\n            {\"title\": \"Applications\", \"text\": \"In-cabin child presence detection, elderly fall detection, smart lighting control, and touchless interfaces for appliances and public kiosks.\"},\n            {\"title\": \"Specifications\", \"text\": \"57 to 64 GHz, three transmit and four receive channels, antenna-in-package, up to 15 metres range, with AEC-Q100 qualification in progress.\"}\n          ],\n          \"labeled\": []\n        },\n        \"bottom-paragraph\": {},\n        \"pills\": [\n          {\"label\": \"60 GHz radar\"},\n          {\"label\": \"4D point cloud\"},\n          {\"label\": \"On-chip DSP\"},\n          {\"label\": \"Privacy by design\"}\n        ],\n        \"cta\": \"Apply for samples\"\n      }\n    }\n  ]\n}\n```\n\n**JSON · JSON Variant 3:**\n\n```json\n{\n  \"section_id\": \"section-a6\",\n  \"components\": [\n    {\n      \"category\": \"product-section\",\n      \"name\": \"astro-product-section\",\n      \"props\": {\n        \"main-heading\": \"Vault M4\",\n        \"badge\": \"Waitlist\",\n        \"top-paragraph\": {\n          \"title\": \"A microcontroller ready for the quantum era.\",\n          \"text\": \"Vault M4 is a secure RISC-V microcontroller with a hardware root of trust and built-in post-quantum cryptography, designed for connected devices that must stay secure for fifteen years or more.\"\n        },\n        \"lists\": {\n          \"numbered\": [],\n          \"rich\": [],\n          \"labeled\": [\n            {\"label\": \"Built for long-lived devices.\", \"text\": \"Smart meters and industrial contro 5 - max 60 words\n\n**JSON · JSON Variant 1:**\n\n```json\n{\n  \"section_id\": \"section-b1\",\n  \"components\": [\n    {\n      \"category\": \"content-section\",\n      \"name\": \"astro-content-section\",\n      \"props\": {\n        \"main-heading\": \"Your product's chip, designed from the specification up\",\n        \"sur-heading\": \"Custom ASIC & SoC Design\",\n        \"sub-heading\": \"We design custom ASICs and RISC-V based SoCs from specification to tape-out, combining our silicon-proven IP library with new blocks built for your product.\",\n        \"lists\": {\n          \"bullet\": [],\n          \"rich\": [],\n          \"paragraph\": [\n            {\"title\": \"Replace a board with a chip\", \"text\": \"One custom chip can replace a board full of discrete parts, cutting power consumption, board area, and unit cost while making your design far harder to copy.\"},\n            {\"title\": \"Built from proven IP\", \"text\": \"Power domains, radar front ends, crypto engines, and RISC-V subsystems already shipping in our own products go into your design, reducing risk and shortening the schedule.\"},\n            {\"title\": \"Cost known from day one\", \"text\": \"Every program starts with a cost-per-unit model that is updated at each gate review, so you always know what the chip will cost at volume before committing further.\"}\n          ]\n        },\n        \"pills\": [\n          {\"label\": \"RISC-V SoCs\"},\n          {\"label\": \"Mixed-signal ASICs\"},\n          {\"label\": \"22nm to 180nm\"},\n          {\"label\": \"MPW prototyping\"}\n        ],\n        \"cta\": \"Start a project\"\n      }\n    }\n  ]\n}\n```\n\n**JSON · JSON Variant 2:**\n\n```json\n{\n  \"section_id\": \"section-b1\",\n  \"components\": [\n    {\n      \"category\": \"content-section\",\n      \"name\": \"astro-content-section\",\n      \"props\": {\n        \"main-heading\": \"Every chip proven before it ships.\",\n        \"sur-heading\": \"Test, Qualification & Reliability\",\n        \"sub-heading\": \"We develop production test programs, run reliability qualification, and handle failure analysis when something comes back from the field.\",\n        \"lists\": {\n          \"bullet\": [\n            {\"text\": \"ATE test program development and optimisation\"},\n            {\"text\": \"AEC-Q100 qualification for automotive programs\"},\n            {\"text\": \"High-temperature operating life testing\"},\n            {\"text\": \"ESD and latch-up testing\"},\n            {\"text\": \"Characterisation across voltage and temperature corners\"},\n            {\"text\": \"Wafer-level and final test correlation\"},\n            {\"text\": \"Full traceability from wafer lot to unit\"},\n            {\"text\": \"8D failure analysis reporting for field returns\"}\n          ],\n          \"rich\": [],\n          \"paragraph\": []\n        },\n        \"pills\": [],\n        \"cta\": \"Contact us\"\n      }\n    }\n  ]\n}\n```\n\n**JSON · JSON Variant 3:**\n\n```json\n{\n  \"section_id\": \"section-b1\",\n  \"components\": [\n    {\n      \"category\": \"content-section\",\n      \"name\": \"astro-content-section\",\n      \"props\": {\n        \"main-heading\": \"We don't just consult. We embed.\",\n        \"sur-heading\": \"Engineering Team Augmentation\",\n        \"sub-heading\": \"We place silicon, firmware, and test engineers directly inside your hardware team, working in your tools and your schedules, not delivering a report and leaving.\",\n        \"lists\": {\n          \"numbered\": [],\n          \"rich\": [\n            {\"title\": \"What we do\", \"text\": \"Embed digital, analog, verification, firmware and test engineers into your hardware team to design, verify, and ship, not just review.\"},\n            {\"title\": \"Why us\", \"text\": \"Engineers who have taken chips through tape-out, onboarded through the same protocols we use internally instead of ad hoc, with VP-level silicon leadership included.\"},\n            {\"title\": \"Process\", \"text\": \"Discovery and scoping first, then engineers embedded in your team for delivery, finishing with a documented handoff under our Customer Handoff Protocol.\"},\n            {\"title\": \"Engagement\", \"text\": \"Custom scoped engagements with a minimum of three months, always starting from a discovery call with our senior engineers.\"},\n            {\"title\": \"Proof\", \"text\": \"23 tape-outs with first-pass silicon success on 19 of them, delivered under our Specification Freeze, Verification Sign-off and Tape-out Readiness protocols.\"}\n          ],\n          \"paragraph\": []\n        },\n        \"pills\": [],\n        \"cta\": \"Book a discovery call\"\n      }\n    }\n  ]\n}\n```\n\n**JSON · JSON Variant 4:**\n\n```json\n{\n  \"section_id\": \"section-b1\",\n  \"components\": [\n    {\n      \"category\": \"content-section\",\n      \"name\": \"astro-content-section\",\n      \"props\": {\n        \"main-heading\": \"Silicon in industrial systems\",\n        \"sur-heading\": \"\",\n        \"sub-heading\": \"Not every product needs a custom chip. Where an off-the-shelf part meets the power, cost, and supply requirements, that part wins. In industrial systems, a single discontinued component can halt a line built to run for twenty years, so integration happens in three tiers.\",\n        \"lists\": {\n          \"bullet\": [],\n          \"rich\": [],\n          \"paragraph\": [\n            {\"title\": \"Consolidation & supply security\", \"text\": \"Discrete regulators, interface chips, and glue logic consolidated into a single standard Korvane part or a small custom ASIC. The board gets smaller, the bill of materials gets shorter, and every critical component comes with a fifteen-year supply commitment.\"},\n            {\"title\": \"Intelligence at the sensor\", \"text\": \"Vision, vibration, and acoustic models run directly on the sensor node, so only events travel over the network. Radar replaces cameras wherever privacy matters, and local decisions keep working when the connection drops.\"},\n            {\"title\": \"Secure, self-managing fleets\", \"text\": \"A hardware root of trust in every device, post-quantum encrypted over-the-air updates across thousands of units, and on-chip telemetry that flags failing devices before they fail. Fully custom SoCs follow once volumes justify them.\"}\n          ]\n        },\n        \"pills\": [],\n        \"cta\": \"Contact us\"\n      }\n    }\n  ]\n}\n```\n\n## Astro FAQ Section\n\n`astro-faq-section`\n\n**Ruleset:**\n\n- Use when asked for an FAQ, frequently asked questions, or any question and answer content\n- Keep the heading between min 1 - max 5 words\n- Keep the sub-heading between min 5 - max 15 words in min 1 - max 2 sentences\n- Keep the items between min 3 - max 8 items\n- Keep the items question as a full question between min 4 - max 12 words\n- Keep the items answer between min 15 - max 50 words\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-c1\",\n  \"components\": [\n    {\n      \"category\": \"faq-section\",\n      \"name\": \"astro-faq-section\",\n      \"props\": {\n        \"heading\": \"Frequently asked questions\",\n        \"sub-heading\": \"Straight answers about working with our silicon team.\",\n        \"items\": [\n          { \"question\": \"How long does a custom ASIC program take?\", \"answer\": \"A typical program runs twelve to eighteen months from specification to first silicon, with MPW prototypes available in the first six months.\"},\n          { \"question\": \"What are the minimum order volumes?\", \"answer\": \"Standard parts ship from a single reel. Custom ASICs usually make sense from around fifty thousand units a year, and we model the cost per unit before you commit.\"},\n          { \"question\": \"How long will parts stay in production?\", \"answer\": \"Every critical component comes with a fifteen-year supply commitment, backed by multi-foundry sourcing for our core process nodes.\"}\n        ]\n      }\n    }\n  ]\n}\n```\n\n## Astro Team Section\n\n`astro-team-section`\n\n**Ruleset:**\n\n- Use when the user asks who is behind the company: the team, founders, leadership, or the people they would work with\n- Send it alone, or after an astro-heading-section or astro-content-section; it can be followed by an astro-cta-section\n- Use `variant` `grid` for the whole team and `featured` when one person leads the answer (founder, CEO, or a person the user asked about); default is `grid`\n- Generate a plausible team that fits the company's industry, size and location\n- Keep the sur-heading to max 1 word\n- Keep the heading between min 3 - max 8 words\n- Keep the sub-heading between min 10 - max 25 words, optional\n- Keep the members between min 3 - max 8 items for `grid`, and min 3 - max 5 items for `featured`, where the first member is the featured one\n- Keep the members name to a first and last name\n- Keep the members role between min 1 - max 5 words\n- Keep the members bio between min 8 - max 20 words, or min 20 - max 40 words for the featured member\n- Keep the members image as an Unsplash portrait photo id, for example `photo-1573496359142-b8d87734a5a2`\n- Keep the members socials between min 0 - max 3 items; `type` is one of `linkedin`, `x`, `github`, and `href` is always `#`\n- Keep the members data-prompt as `Tell me more about <name>`\n- Keep the ctas between min 0 - max 1 item; send `href` as a route starting with `/` to navigate, or `data-prompt` to ask the agent, empty when it only navigates\n\n**JSON · grid:**\n\n```json\n{\n  \"section_id\": \"section-a11\",\n  \"components\": [\n    {\n      \"category\": \"team-section\",\n      \"name\": \"astro-team-section\",\n      \"props\": {\n        \"variant\": \"grid\",\n        \"sur-heading\": \"Team\",\n        \"heading\": \"The engineers behind every tape-out\",\n        \"sub-heading\": \"Silicon, firmware and test engineers who have shipped chips at scale, now worki l": "Open reference designs"}]}]}}]}, {"id": "step-3-reads-about-one-chip", "title": "Step 3 · Reads about one chip", "user": "Tell me about Nerva N1", "why": "One product in detail: <code>astro-product-section<\/code>, then a CTA to turn interest into action.", "code": "[\n  {\n    \"section_id\": \"section-a3\",\n    \"components\": [\n      {\n        \"category\": \"product-section\",\n        \"name\": \"astro-product-section\",\n        \"props\": {\n          \"main-heading\": \"Nerva N1\",\n          \"badge\": \"In Production\",\n          \"top-paragraph\": {\n            \"title\": \"Run vision AI on the device, not the cloud.\",\n            \"text\": \"Smart cameras and robots need real-time neural networks, but GPUs draw too much power and cloud inference adds latency and privacy risk. Nerva N1 runs vision and audio models locally at 8 TOPS while drawing under one watt.\"\n          },\n          \"lists\": {\n            \"numbered\": [\n              {\n                \"text\": \"Train your model in PyTorch or TensorFlow as usual\"\n              },\n              {\n                \"text\": \"Compile it with the Nerva toolchain to INT8 or INT4\"\n              },\n              {\n                \"text\": \"Connect Nerva N1 to your host over PCIe or USB\"\n              },\n              {\n                \"text\": \"Stream camera frames directly in through MIPI CSI-2 inputs\"\n              },\n              {\n                \"text\": \"Your model runs on the device at under one watt\"\n              }\n            ],\n            \"rich\": [],\n            \"labeled\": []\n          },\n          \"bottom-paragraph\": {\n            \"title\": \"What sets it apart from GPUs and NPUs\",\n            \"text\": \"Unlike general-purpose GPUs and NPUs bundled into application processors, Nerva N1 keeps the full model in on-chip memory, so it never stalls waiting on external DRAM. That delivers consistent frame rates, no thermal throttling, and no fan.\"\n          },\n          \"pills\": [\n            {\n              \"label\": \"8 TOPS\"\n            },\n            {\n              \"label\": \"Sub-1W\"\n            },\n            {\n              \"label\": \"INT4/INT8\"\n            },\n            {\n              \"label\": \"On-chip SRAM\"\n            },\n            {\n              \"label\": \"22nm FD-SOI\"\n            }\n          ],\n          \"cta\": \"View the datasheet\"\n        }\n      }\n    ]\n  },\n  {\n    \"section_id\": \"section-a4\",\n    \"components\": [\n      {\n        \"category\": \"cta-section\",\n        \"name\": \"astro-cta-section\",\n        \"props\": {\n          \"heading\": \"Tape out with us.\",\n          \"sur-heading\": \"Collaborate\",\n          \"sub-heading\": \"Tell us what you're building; we'll tell you honestly whether you need custom silicon at all.\"\n        }\n      }\n    ]\n  }\n]", "items": [{"name": "astro-product-section", "section_id": "section-a3", "props": {"main-heading": "Nerva N1", "badge": "In Production", "top-paragraph": {"title": "Run vision AI on the device, not the cloud.", "text": "Smart cameras and robots need real-time neural networks, but GPUs draw too much power and cloud inference adds latency and privacy risk. Nerva N1 runs vision and audio models locally at 8 TOPS while drawing under one watt."}, "lists": {"numbered": [{"text": "Train your model in PyTorch or TensorFlow as usual"}, {"text": "Compile it with the Nerva toolchain to INT8 or INT4"}, {"text": "Connect Nerva N1 to your host over PCIe or USB"}, {"text": "Stream camera frames directly in through MIPI CSI-2 inputs"}, {"text": "Your model runs on the device at under one watt"}], "rich": [], "labeled": []}, "bottom-paragraph": {"title": "What sets it apart from GPUs and NPUs", "text": "Unlike general-purpose GPUs and NPUs bundled into application processors, Nerva N1 keeps the full model in on-chip memory, so it never stalls waiting on external DRAM. That delivers consistent frame rates, no thermal throttling, and no fan."}, "pills": [{"label": "8 TOPS"}, {"label": "Sub-1W"}, {"label": "INT4/INT8"}, {"label": "On-chip SRAM"}, {"label": "22nm FD-SOI"}], "cta": "View the datasheet"}}, {"name": "astro-cta-section", "section_id": "section-a4", "props": {"heading": "Tape out with us.", "sur-heading": "Collaborate", "sub-heading": "Tell us what you're building; we'll tell you honestly whether you need custom silicon at all."}}]}, {"id": "step-4-wants-to-talk", "title": "Step 4 · Wants to talk", "user": "I'd like to start a project", "why": "A heading frames the next step; the contact form needs no props.", "code": "[\n  {\n    \"section_id\": \"section-a5\",\n    \"components\": [\n      {\n        \"category\": \"heading-section\",\n        \"name\": \"astro-heading-section\",\n        \"props\": {\n          \"heading\": \"Tell us what you're building.\",\n          \"sur-heading\": \"Contact\",\n          \"sub-text\": \"Engagements start with a discovery call. Share your expected annual volume and what you're building, and a senior engineer will reply honestly about whether custom silicon makes sense.\"\n        }\n      }\n    ]\n  },\n  {\n    \"section_id\": \"section-a6\",\n    \"components\": [\n      {\n        \"category\": \"contact-section\",\n        \"name\": \"astro-contact-section\"\n      }\n    ]\n  }\n]", "items": [{"name": "astro-heading-section", "section_id": "section-a5", "props": {"heading": "Tell us what you're building.", "sur-heading": "Contact", "sub-text": "Engagements start with a discovery call. Share your expected annual volume and what you're building, and a senior engineer will reply honestly about whether custom silicon makes sense."}}, {"name": "astro-contact-section", "section_id": "section-a6", "props": {}}]}]}, {"id": "02-do-we-need-custom-silicon", "file": "webagen.astrosynapse.ai/templates/website/layouts/02-do-we-need-custom-silicon.md", "title": "Do we need custom silicon?", "intro": "<p>A product manager isn't sure a custom chip is worth it. The agent answers honestly, explains the process and the cost questions, and offers a discovery call.<\/p>", "steps": [{"id": "step-1-the-real-question", "title": "Step 1 · The real question", "user": "Do we even need a custom chip?", "why": "The topic shifts to a judgement call, so a heading leads; a content section with the three tiers gives the substance.", "code": "[\n  {\n    \"section_id\": \"section-a1\",\n    \"components\": [\n      {\n        \"category\": \"heading-section\",\n        \"name\": \"astro-heading-section\",\n        \"props\": {\n          \"heading\": \"Maybe not. Here is how to tell.\",\n          \"sur-heading\": \"Honestly\",\n          \"sub-text\": \"If an off-the-shelf part meets your power, cost and supply requirements, we will tell you to buy it. Custom silicon earns its place only when standard parts become the more expensive option.\"\n        }\n      }\n    ]\n  },\n  {\n    \"section_id\": \"section-a2\",\n    \"components\": [\n      {\n        \"category\": \"content-section\",\n        \"name\": \"astro-content-section\",\n        \"props\": {\n          \"main-heading\": \"Silicon in industrial systems\",\n          \"sur-heading\": \"\",\n          \"sub-heading\": \"Not every product needs a custom chip. Where an off-the-shelf part meets the power, cost, and supply requirements, that part wins. In industrial systems, a single discontinued component can halt a line built to run for twenty years, so integration happens in three tiers.\",\n          \"lists\": {\n            \"bullet\": [],\n            \"rich\": [],\n            \"paragraph\": [\n              {\n                \"title\": \"Consolidation & supply security\",\n                \"text\": \"Discrete regulators, interface chips, and glue logic consolidated into a single standard Korvane part or a small custom ASIC. The board gets smaller, the bill of materials gets shorter, and every critical component comes with a fifteen-year supply commitment.\"\n              },\n              {\n                \"title\": \"Intelligence at the sensor\",\n                \"text\": \"Vision, vibration, and acoustic models run directly on the sensor node, so only events travel over the network. Radar replaces cameras wherever privacy matters, and local decisions keep working when the connection drops.\"\n              },\n              {\n                \"title\": \"Secure, self-managing fleets\",\n                \"text\": \"A hardware root of trust in every device, post-quantum encrypted over-the-air updates across thousands of units, and on-chip telemetry that flags failing devices before they fail. Fully custom SoCs follow once volumes justify them.\"\n              }\n            ]\n          },\n          \"pills\": [],\n          \"cta\": \"Contact us\"\n        }\n      }\n    ]\n  }\n]", "items": [{"name": "astro-heading-section", "section_id": "section-a1", "props": {"heading": "Maybe not. Here is how to tell.", "sur-heading": "Honestly", "sub-text": "If an off-the-shelf part meets your power, cost and supply requirements, we will tell you to buy it. Custom silicon earns its place only when standard parts become the more expensive option."}}, {"name": "astro-content-section", "section_id": "section-a2", "props": {"main-heading": "Silicon in industrial systems", "sur-heading": "", "sub-heading": "Not every product needs a custom chip. Where an off-the-shelf part meets the power, cost, and supply requirements, that part wins. In industrial systems, a single discontinued component can halt a line built to run for twenty years, so integration happens in three tiers.", "lists": {"bullet": [], "rich": [], "paragraph": [{"title": "Consolidation & supply security", "text": "Discrete regulators, interface chips, and glue logic consolidated into a single standard Korvane part or a small custom ASIC. The board gets smaller, the bill of materials gets shorter, and every critical component comes with a fifteen-year supply commitment."}, {"title": "Intelligence at the sensor", "text": "Vision, vibration, and acoustic models run directly on the sensor node, so only events travel over the network. Radar replaces cameras wherever privacy matters, and local decisions keep working when the connection drops."}, {"title": "Secure, self-managing fleets", "text": "A hardware root of trust in every device, post-quantum encrypted over-the-air updates across thousands of units, and on-chip telemetry that flags failing devices before they fail. Fully custom SoCs follow once volumes justify them."}]}, "pills": [], "cta": "Contact us"}}]}, {"id": "step-2-how-it-works", "title": "Step 2 · How it works", "user": "How does a custom chip project work?", "why": "Ordered steps belong in the numbered list of <code>astro-content-section<\/code>.", "code": "[\n  {\n    \"section_id\": \"section-a3\",\n    \"components\": [\n      {\n        \"category\": \"content-section\",\n        \"name\": \"astro-content-section\",\n        \"props\": {\n          \"main-heading\": \"From first conversation to production silicon\",\n          \"sur-heading\": \"Our process\",\n          \"sub-heading\": \"Nine stages, each ending in a written gate review, an updated cost per unit and a clear go or no-go recommendation.\",\n          \"lists\": {\n            \"bullet\": [],\n            \"numbered\": [\n              {\n                \"text\": \"Discovery: decide together whether custom silicon makes sense at all.\"\n              },\n              {\n                \"text\": \"Specification: freeze functions, interfaces, power targets, package and unit cost.\"\n              },\n              {\n                \"text\": \"Architecture: partition the system and model power before any design.\"\n              },\n              {\n                \"text\": \"Design: RTL, analog schematics and layout from silicon-proven IP.\"\n              },\n              {\n                \"text\": \"Verification: testbenches, formal checks and FPGA prototypes until coverage closes.\"\n              },\n              {\n                \"text\": \"Physical design: floorplan, place and route, timing closure, sign-off.\"\n              },\n              {\n                \"text\": \"Tape-out: the design goes to the foundry for prototypes.\"\n              },\n              {\n                \"text\": \"Bring-up: first silicon tested across voltage and temperature, firmware ready.\"\n              },\n              {\n                \"text\": \"Qualification: reliability testing, then handover to dual-sourced volume production.\"\n              }\n            ],\n            \"rich\": [],\n            \"paragraph\": []\n          },\n          \"pills\": [\n            {\n              \"label\": \"14–22 months\"\n            },\n            {\n              \"label\": \"Derivatives: 9 months\"\n            },\n            {\n              \"label\": \"Gate reviews\"\n            }\n          ],\n          \"cta\": \"Book a discovery call\"\n        }\n      }\n    ]\n  }\n]", "items": [{"name": "astro-content-section", "section_id": "section-a3", "props": {"main-heading": "From first conversation to production silicon", "sur-heading": "Our process", "sub-heading": "Nine stages, each ending in a written gate review, an updated cost per unit and a clear go or no-go recommendation.", "lists": {"bullet": [], "numbered": [{"text": "Discovery: decide together whether custom silicon makes sense at all."}, {"text": "Specification: freeze functions, interfaces, power targets, package and unit cost."}, {"text": "Architecture: partition the system and model power before any design."}, {"text": "Design: RTL, analog schematics and layout from silicon-proven IP."}, {"text": "Verification: testbenches, formal checks and FPGA prototypes until coverage closes."}, {"text": "Physical design: floorplan, place and route, timing closure, sign-off."}, {"text": "Tape-out:
