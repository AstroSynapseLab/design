  if (!d) return header(t, t.title, "Design", esc(t.description)) + (t.readme ? `<div class="prose">${t.readme}</div><br>` : "") + emptyState(t, "design");
  const blocks = s => s.blocks.map(b => {
    if (b.kind === "colors") {
      const modes = Object.keys(b.data.modes); const cur = modes.includes(theme()) ? theme() : modes[0];
      return `<div data-colors><div class="mode-bar"><div class="seg">${modes.map(m => `<button data-mode="${m}" aria-pressed="${m === cur}">${m[0].toUpperCase() + m.slice(1)}</button>`).join("")}</div><span class="note" style="margin:0">Values for the selected mode</span></div>
        ${modes.map(m => `<div class="swatches" data-m="${m}" ${m === cur ? "" : "hidden"}>${Object.entries(b.data.modes[m]).map(([k, v]) => `<div class="sw"><i style="background:${esc(v)}"></i><div><b>${esc(k)}</b><span>${esc(v)}</span>${b.data.usage?.[k] ? `<em>${esc(b.data.usage[k])}</em>` : ""}</div></div>`).join("")}</div>`).join("")}</div>`;
    }
    if (b.kind === "type") return b.data.map(x => { const px = Math.min(56, parseFloat(String(x.size).split(/[–-]/).pop()) || 16);
      return `<div class="type-row"><div class="meta-col"><b>${esc(x.name)}</b>${esc(x.family)} · ${esc(x.weight)}<br>${esc(x.size)}${x.case !== "none" ? " · " + esc(x.case) : ""}${x.tracking && x.tracking !== "0" ? " · " + esc(x.tracking) : ""}<br>${esc(x.use || "")}</div>
        <div class="sample" style="font-family:'${esc(x.family)}',Inter,sans-serif;font-weight:${esc(x.weight)};font-size:${px}px;text-transform:${x.case === "uppercase" ? "uppercase" : "none"};letter-spacing:${esc(x.tracking || 0)}">${esc(x.sample)}</div></div>`; }).join("");
    if (b.kind === "scale") return `<div class="scale-grid">${Object.entries(b.data).map(([group, vals]) => `<div class="scale"><h4 class="label">${esc(group)}</h4>${Object.entries(vals).map(([k, v]) => { const n = parseFloat(v);
      return `<div class="scale-row"><b>${esc(k)}</b><span>${esc(v)}</span>${/radius/i.test(group) && !isNaN(n) ? `<i class="r" style="border-radius:${Math.min(n, 16)}px"></i>` : /spacing/i.test(group) && !isNaN(n) ? `<i style="width:${Math.min(n * 1.5, 160)}px"></i>` : "<span></span>"}</div>`; }).join("")}</div>`).join("")}</div>`;
    return "";
  }).join("");
  return header(t, t.title, d.title, "", `<span class="chip">${esc(d.source)}</span>`) + `<div class="prose" style="margin-bottom:32px">${d.intro}</div>` +
    d.sections.map(s => `<section class="dsec" id="${s.id}"><h2>${esc(s.title)}</h2><div class="prose">${s.html}</div>${blocks(s)}
      ${s.kit ? `<div class="card" style="margin-top:16px"><div class="part"><div class="part-head"><span class="label">Live UI kit · ${esc(s.kit)}</span>${viewportSeg()}</div><div class="stage" data-stage data-items='${esc(JSON.stringify([{ name: s.kit, props: {} }]))}' data-h="900"></div></div></div>` : ""}</section>`).join("");
}

function compCard(t, c) {
  const v = c.variants;
  const rulesMd = c.rules.map(r => "- " + strip(r).replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&")).join("\n");
  const layout = `<div class="stage" data-stage data-items='${esc(JSON.stringify([{ name: c.id, props: v[0].props }]))}'></div>${c.layout.kind === "wire" ? `<p class="note">Wireframe from the JSON example. Add a renderer for <code>${esc(c.id)}</code> to the project's <code>renderers/</code> and list it in <code>build.json</code>.</p>` : ""}`;
  return `<section class="card" id="${c.id}" data-c="${c.id}">
    <div class="card-head"><h2>${esc(c.title)}</h2><span class="chip">${esc(c.id)}</span>${v.length > 1 ? `<span class="chip">${v.length} variants</span>` : ""}${c.layout.kind === "wire" ? `<span class="chip chip--wire">wireframe</span>` : ""}${c.problems.length ? `<span class="chip chip--warn" title="${esc(c.problems.join("\n"))}">Invalid JSON</span>` : ""}</div>
    <div class="part"><div class="part-head"><span class="label">Ruleset</span><button class="copy" data-copy="${esc(rulesMd)}">${COPY}Copy</button></div><ul class="rules">${c.rules.map(r => `<li>${r}</li>`).join("")}</ul></div>
    <div class="part"><div class="part-head"><span class="label">JSON</span><div class="tools">${v.length > 1 ? `<div class="seg" data-variants>${v.map((x, i) => `<button aria-pressed="${i === 0}" data-v="${i}">${esc(x.label)}</button>`).join("")}</div>` : ""}<button class="copy" data-copy-json>${COPY}Copy</button></div></div>
      <pre data-code>${hl(v[0].code)}</pre>${v[0].error ? `<p class="err">Invalid JSON, ${esc(v[0].error)}</p>` : ""}</div>
    <div class="part part--layout"><div class="part-head"><span class="label">Layout</span>${viewportSeg()}</div>${layout}</div></section>`;
}
function pageComponents(t) {
  const c = t.components;
  if (!c.components.length) return header(t, "", "Components", "") + emptyState(t, "components");
  const live = c.components.filter(x => x.layout.kind === "live").length;
  return header(t, "", "Components", "",
    `<button class="copy" data-download-components>${DOWNLOAD}Download .md</button><span class="chip">${esc(c.source)}</span><span class="chip">${c.components.length} components</span><span class="chip">${live} live previews</span>${live < c.components.length ? `<span class="chip chip--wire">${c.components.length - live} wireframes</span>` : ""}`) +
    c.shared.map(s => `<div class="shared" id="${s.id}"><h2>${esc(s.title)}</h2><ul class="rules">${s.rules.map(r => `<li>${r}</li>`).join("")}</ul></div>`).join("") +
    c.components.map(x => compCard(t, x)).join("");
}

function pageLayouts(t) {
  if (!t.layouts.length) return header(t, t.title, "Example layouts", "Hypothetical flows from user interaction with the website, built from the components.") + emptyState(t, "example layouts");
  const names = new Set(t.components.components.map(c => c.id));
  return header(t, t.title, "Example layouts", "Hypothetical visitor journeys. Each step is the user's message and the exact JSON the agent sends back, rendered with the components.", `<span class="chip">${esc(t.path)}/layouts/</span><span class="chip">${t.layouts.length} flows</span>`) +
    t.layouts.map(f => `<section class="flow" id="${f.id}"><h2>${esc(f.title)}</h2><div class="prose lede">${f.intro}</div><div class="meta"><span class="chip">${esc(f.file)}</span><span class="chip">${f.steps.length} steps</span></div>
      ${f.steps.map((s, i) => `<article class="step" id="${f.id}--${s.id}"><div class="step-head"><span class="label">Step ${i + 1}</span><h3>${esc(s.title.replace(/^Step \d+ · /, ""))}</h3></div>
        <div class="chat"><div class="bubble">${s.user}</div></div>${s.why ? `<div class="why"><b>Why:</b> ${s.why}</div>` : ""}
        <div class="comp-chips">${s.items.map(it => names.has(it.name) ? `<a class="chip" href="${here("components", it.name)}">${esc(it.name)}</a>` : `<span class="chip chip--warn">${esc(it.name)}</span>`).join("")}</div>
        <div class="part"><div class="part-head"><span class="label">Response · ${s.items.length} section${s.items.length === 1 ? "" : "s"}</span><div class="tools">${viewportSeg()}<button class="copy" data-copy="${esc(s.code)}">${COPY}Copy JSON</button></div></div>
          <div class="stage" data-stage data-items='${esc(JSON.stringify(s.items.map(x => ({ name: x.name, props: x.props }))))}' data-h="600"></div>
          <details class="json" style="margin-top:12px"><summary>Response JSON</summary><pre>${hl(s.code)}</pre></details></div></article>`).join("")}</section>`).join("");
}

function pageContent(t) {
  if (!t.content) return header(t, t.title, "Content", "Default web content the agent answers from.") + emptyState(t, "content");
  return header(t, t.title, "Content", "Default web content for this template. The agent treats it as the source of truth for every fact it shows.", `<span class="chip">${esc(t.content.source)}</span><button class="copy" data-copy-content>${COPY}Copy markdown path</button>`) + `<div class="prose">${t.content.html}</div>`;
}

/* ---------------- clickable sites: a website, or a template's prototype ----------------
   The frame loads the site's real pages from their own folder; each page includes frame.js, which reports
   which page is open, so the address bar, page list and back/forward follow links inside the site. */
let PROTO = null; // { key, history: [{ file, title }], idx, expect }
const protoKey = () => `${S.proj}/${S.item}`;
function protoStart(it) { const pg = it.prototype.pages[0]; PROTO = { key: protoKey(), history: [{ file: pg.file, title: pg.title }], idx: 0, expect: null }; }
function siteGo(it, file) {
  const pg = it.prototype.pages.find(x => x.file === file) || { file, title: file };
  PROTO.history = PROTO.history.slice(0, PROTO.idx + 1); PROTO.history.push({ file, title: pg.title }); PROTO.idx++;
  protoPaint(it);
}
function siteChrome(it) {
  const page = PROTO.history[PROTO.idx];
  $("#proto-addr").innerHTML = `<span>›</span><b>${esc(page.file)}</b>${page.title ? `<span>${esc(page.title)}</span>` : ""}`;
  $("#proto-back").disabled = PROTO.idx === 0; $("#proto-fwd").disabled = PROTO.idx >= PROTO.history.length - 1;
  $("#proto-open").href = it.prototype.base + page.file;
  document.querySelectorAll(".side [data-proto-page]").forEach(a => a.classList.toggle("active", a.dataset.protoPage === page.file));
}
function protoPaint(it) {
  const st = $("#proto-stage"); if (!st) return;
  const page = PROTO.history[PROTO.idx];
  const f = document.createElement("iframe"); f.title = it.title; f.id = "proto-frame";
  PROTO.expect = page.file; f.src = it.prototype.base + page.file;
  st.replaceChildren(f); siteChrome(it);
}
function pageSite(it) {
  const pr = it.prototype;
  if (!pr) return `<div style="padding:36px 48px">${header(it, it.title, it.type === "website" ? "Website" : "Prototype", "")}<div class="empty"><h2>No pages yet</h2><p>Add an <code>index.html</code> to <code>${esc(it.type === "website" ? it.path : it.path + "/prototype")}/</code> and run <code>python3 build.py</code>.</p></div></div>`;
  if (!PROTO || PROTO.key !== protoKey()) protoStart(it);
  return `<div class="proto"><div class="proto-bar"><button class="icon-btn" id="proto-back" aria-label="Back" title="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><button class="icon-btn" id="proto-fwd" aria-label="Forward" title="Forward"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button><button class="icon-btn" id="proto-home" aria-label="Start over" title="Start over"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
      <div class="addr" id="proto-addr"></div><div class="seg" data-proto-vp><button aria-pressed="true" data-w="desktop">Desktop</button><button aria-pressed="false" data-w="mobile">Mobile</button></div>
      <a class="icon-btn" id="proto-open" href="${esc(pr.base)}index.html" target="_blank" rel="noopener" aria-label="Open in a new tab" title="Open in a new tab"><svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a></div>
    <div class="proto-stage" id="proto-stage"></div></div>`;
}

/* ---------------- search (templates) ---------------- */
function searchIndex() {
  const out = [];
  for (const p of PROJECTS) for (const t of p.items) {
    if (t.type !== "template") continue;
    const at = { p, t };
    t.design?.sections.forEach(s => out.push({ ...at, page: "design", id: s.id, kind: "Design", title: s.title, text: strip(s.html) + JSON.stringify(s.blocks) }));
    t.components.components.forEach(c => out.push({ ...at, page: "components", id: c.id, kind: "Component", title: c.title, sub: c.id, text: [c.id, ...c.rules.map(strip), ...c.variants.map(v => v.code)].join("\n") }));
    t.layouts.forEach(f => f.steps.forEach(s => out.push({ ...at, page: "layouts", id: f.id + "--" + s.id, kind: "Layout step", title: `${f.title} · ${s.title}`, sub: strip(s.user), text: [f.title, strip(s.user), strip(s.why), s.code].join("\n") })));
    t.content?.toc.forEach(x => out.push({ ...at, page: "content", id: x.id, kind: "Content", title: x.title, text: x.title }));
  }
  return out;
}
const INDEX = searchIndex();
function pageSearch() {
  const terms = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = INDEX.filter(x => { const h = (x.title + " " + (x.sub || "") + " " + x.text).toLowerCase(); return terms.every(w => h.includes(w)); });
  const groups = [...new Set(hits.map(h => h.t))].map(t => hits.filter(h => h.t === t));
  return `<div class="intro"><div class="eyebrow">Search</div><h1>“${esc(S.q)}”</h1><p>${hits.length} match${hits.length === 1 ? "" : "es"}.</p></div><div class="results">` +
    (groups.map(h => `<h4 class="label" style="margin:24px 0 10px">${esc(h[0].p.title)} · ${esc(h[0].t.title)}</h4>` + h.slice(0, 60).map(x => `<a class="res" href="${href(x.p.id, x.t.id, x.page, x.id)}"><span class="chip">${esc(x.kind)}</span> <b>${esc(x.title)}</b>${x.sub ? `<p>${esc(x.sub)}</p>` : ""}</a>`).join("")).join("") ||
      `<div class="empty"><h2>Nothing found</h2><p>Try a component name like <code>hero</code>, a prop like <code>data-prompt</code> or a colour like <code>accent</code>.</p></div>`) + `</div>`;
}

/* ---------------- render ---------------- */
function render() {
  renderChrome();
  const it = I();
  $("#side").innerHTML = S.q ? "" : sideFor(it);
  $("#main").classList.toggle("main--wide", !S.q && it?.type === "template" && S.page === "components");
  $("#main").classList.toggle("main--bleed", !S.q && isSiteView(it));
  const page = { design: pageDesign, components: pageComponents, layouts: pageLayouts, content: pageContent }[S.page] || pageDesign;
  $("#main").innerHTML = S.q ? pageSearch()
    : !it ? `<div class="empty"><h2>Nothing to show yet</h2><p>Add a website or a template to this project in <code>build.json</code> and run <code>python3 build.py</code>.</p></div>`
    : isSiteView(it) ? pageSite(it) : page(it);
  if (!S.q && isSiteView(it) && it.prototype && PROTO) protoPaint(it);
  STAGES.clear();
  document.querySelectorAll("[data-stage][data-items]").forEach(st => mountStage(st, JSON.parse(st.dataset.items)));
  spy();
  if (S.anchor) requestAnimationFrame(() => document.getElementById(S.anchor)?.scrollIntoView()); else scrollTo(0, 0);
}
function spy() {
  const links = [...document.querySelectorAll(".side a[data-id]")]; if (!links.length) return;
  const targets = links.map(a => document.getElementById(a.dataset.id)).filter(Boolean);
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(a => a.classList.toggle("active", a.dataset.id === en.target.id)); }), { rootMargin: "-120px 0px -65% 0px" });
  targets.forEach(x => io.observe(x));
}
/* #/<project>/<item>/<page>/<anchor>; a website has no page */
function route() {
  const [proj, item, page, anchor] = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/");
  const p = PROJECTS.find(x => x.id === proj) || PROJECTS[0];
  S.proj = p ? p.id : "";
  const it = p?.items.find(x => x.id === item) || p?.items[0];
  S.item = it ? it.id : "";
  S.page = it?.type === "template" ? (PAGES.some(([x]) => x === page) ? page : (it.prototype ? "prototype" : "design")) : "";
  S.anchor = anchor || ""; S.q = ""; $("#q").value = "";
  render();
}

/* ---------------- events ---------------- */
async function copy(btn, text) {
  try { await navigator.clipboard.writeText(text); } catch { const x = document.createElement("textarea"); x.value = text; document.body.appendChild(x); x.select(); document.execCommand("copy"); x.remove(); }
  const old = btn.innerHTML; btn.classList.add("done"); btn.innerHTML = COPY + "Copied"; setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = old; }, 1400);
}
let toastT; function toast(h) { const x = $("#toast"); x.innerHTML = h; x.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => x.classList.remove("show"), 2600); }
document.addEventListener("click", e => {
  const pp = e.target.closest("[data-proto-page]"); if (pp) { e.preventDefault(); if (PROTO && PROTO.key === protoKey()) siteGo(I(), pp.dataset.protoPage); return; }
  if (e.target.closest("#proto-back")) { if (PROTO.idx > 0) { PROTO.idx--; protoPaint(I()); } return; }
  if (e.target.closest("#proto-fwd")) { if (PROTO.idx < PROTO.history.length - 1) { PROTO.idx++; protoPaint(I()); } return; }
  if (e.target.closest("#proto-home")) { protoStart(I()); protoPaint(I()); return; }
  const pv = e.target.closest("[data-proto-vp] button"); if (pv) { pv.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === pv)); $("#proto-stage").classList.toggle("mobile", pv.dataset.w === "mobile"); return; }
  const cb = e.target.closest(".copy"); if (cb) {
    const card = cb.closest(".card[data-c]");
    if (cb.hasAttribute("data-copy-json") && card) { const c = T().components.components.find(x => x.id === card.dataset.c); const i = +(card.querySelector("[data-variants] [aria-pressed=true]")?.dataset.v || 0); return copy(cb, c.variants[i].code); }
    if (cb.hasAttribute("data-copy-content")) return copy(cb, T().content.source);
    if (cb.hasAttribute("data-download-components")) { const x = T().components.export; const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([x.md], { type: "text/markdown" })); a.download = x.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); return; }
    return copy(cb, cb.dataset.copy);
  }
  const vb = e.target.closest("[data-variants] button"); if (vb) {
    const card = vb.closest(".card[data-c]"); const c = T().components.components.find(x => x.id === card.dataset.c); const v = c.variants[+vb.dataset.v];
    vb.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === vb));
    card.querySelector("[data-code]").innerHTML = hl(v.code);
    const st = card.querySelector("[data-stage]"); if (st) mountStage(st, [{ name: c.id, props: v.props }]); return;
  }
  const wb = e.target.closest("[data-viewport] button"); if (wb) {
    wb.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === wb));
    wb.closest(".part, .card").querySelector("[data-stage]")?.classList.toggle("mobile", wb.dataset.w === "mobile"); return;
  }
  const mb = e.target.closest("[data-colors] [data-mode]"); if (mb) {
    const box = mb.closest("[data-colors]"); box.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b === mb));
    box.querySelectorAll("[data-m]").forEach(g => g.hidden = g.dataset.m !== mb.dataset.mode); return;
  }
});
addEventListener("message", e => {
  const d = e.data || {};
  const pf = $("#proto-frame");
  if (d.designFrame && pf && e.source === pf.contentWindow && PROTO) { // sent by frame.js
    const cur = PROTO.history[PROTO.idx], pg = d.designFrame.page;
    if (PROTO.expect === pg || cur.file === pg) cur.title = d.designFrame.title || cur.title; // our own navigation, or a reload
    else { PROTO.history = PROTO.history.slice(0, PROTO.idx + 1); PROTO.history.push({ file: pg, title: d.designFrame.title || "" }); PROTO.idx++; } // a link inside the site
    PROTO.expect = null; siteChrome(I()); return;
  }
  if (d.h) document.querySelectorAll("iframe").forEach(f => { if (f.contentWindow === e.source) f.style.height = d.h + "px"; });
  if (d.click) { const k = d.click; toast(k.prompt ? `Sends data-prompt: <b>${esc(k.prompt)}</b>` : k.anchor ? `Scrolls to anchor: <b>${esc(k.anchor)}</b>` : k.href ? `Navigates to href: <b>${esc(k.href)}</b>` : `Frontend action, no prompt: <b>${esc(k.action || "static")}</b>`); }
});
let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); if (!S.q) return route(); render(); }, 140); });
addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("#q")) { $("#q").value = ""; route(); }
});
$("#theme").addEventListener("click", () => {
  document.documentElement.dataset.theme = theme() === "dark" ? "light" : "dark";
  try { localStorage.setItem("design-theme", document.documentElement.dataset.theme); } catch {}
  if (I()?.type === "template" && S.page === "design" && !S.q) render(); else remountAll();
});
try { const th = localStorage.getItem("design-theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
addEventListener("hashchange", route);
route();
</script>
