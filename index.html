en volume, power, size, security or supply risk make standard parts more expensive.\"\n            }\n          ]\n        }\n      }\n    ]\n  },\n  {\n    \"section_id\": \"section-a5\",\n    \"components\": [\n      {\n        \"category\": \"cta-section\",\n        \"name\": \"astro-cta-section\",\n        \"props\": {\n          \"heading\": \"Tape out with us.\",\n          \"sur-heading\": \"Collaborate\",\n          \"sub-heading\": \"Tell us what you're building; we'll tell you honestly whether you need custom silicon at all.\"\n        }\n      }\n    ]\n  }\n]", "items": [{"name": "astro-faq-section", "section_id": "section-a4", "props": {"heading": "Time and cost", "sub-heading": "Straight answers before you commit to anything.", "items": [{"question": "How long does a custom ASIC program take?", "answer": "A typical program takes 14 to 22 months from first conversation to production silicon. A derivative of existing Korvane IP can take as little as nine months."}, {"question": "What will each chip cost us?", "answer": "We model the cost per unit from day one and update it at every stage gate, so you always know the number before deciding to continue."}, {"question": "Can we stop partway through?", "answer": "Yes. You can stop at any gate and keep everything produced so far: specifications, models, verification work and any silicon that has been made."}, {"question": "What if a standard part would do?", "answer": "Then we will tell you to buy it. Custom silicon only earns its place when volume, power, size, security or supply risk make standard parts more expensive."}]}}, {"name": "astro-cta-section", "section_id": "section-a5", "props": {"heading": "Tape out with us.", "sur-heading": "Collaborate", "sub-heading": "Tell us what you're building; we'll tell you honestly whether you need custom silicon at all."}}]}]}, {"id": "03-who-is-behind-korvane", "file": "webagen.astrosynapse.ai/templates/website/layouts/03-who-is-behind-korvane.md", "title": "Who is behind Korvane?", "intro": "<p>A visitor wants to know the people before the product: who leads the company, whether it's hiring, and how its engineers work with clients.<\/p>", "steps": [{"id": "step-1-meets-the-founders", "title": "Step 1 · Meets the founders", "user": "Who runs Korvane?", "why": "<code>astro-team-section<\/code> with <code>variant<\/code> <code>featured<\/code>: the CEO leads. The names and roles come from the company document's Leadership section.", "code": "[\n  {\n    \"section_id\": \"section-a1\",\n    \"components\": [\n      {\n        \"category\": \"team-section\",\n        \"name\": \"astro-team-section\",\n        \"props\": {\n          \"variant\": \"featured\",\n          \"sur-heading\": \"Leadership\",\n          \"heading\": \"Four engineers who founded Korvane\",\n          \"sub-heading\": \"They spent their careers inside large chip companies, then left to design the chips those companies wouldn't.\",\n          \"members\": [\n            {\n              \"name\": \"Ilse Varendonck\",\n              \"role\": \"Co-founder & CEO\",\n              \"bio\": \"Previously led mixed-signal product lines for industrial markets. Founded Korvane in 2019 to design the low-volume, long-life chips that big semiconductor companies kept cancelling.\",\n              \"image\": \"photo-1573496359142-b8d87734a5a2\",\n              \"socials\": [\n                {\n                  \"type\": \"linkedin\",\n                  \"href\": \"#\"\n                }\n              ],\n              \"data-prompt\": \"Tell me more about Ilse Varendonck\"\n            },\n            {\n              \"name\": \"Tomás Revelo\",\n              \"role\": \"Co-founder & CTO\",\n              \"bio\": \"Digital architect behind three generations of low-power SoCs; leads the Eindhoven design center.\",\n              \"image\": \"photo-1500648767791-00dcc994a43e\",\n              \"socials\": [\n                {\n                  \"type\": \"linkedin\" {\n                \"title\": \"Engagement\",\n                \"text\": \"Custom scoped engagements with a minimum of three months, always starting from a discovery call with our senior engineers.\"\n              },\n              {\n                \"title\": \"Proof\",\n                \"text\": \"23 tape-outs with first-pass silicon success on 19 of them, delivered under our Specification Freeze, Verification Sign-off and Tape-out Readiness protocols.\"\n              }\n            ],\n            \"paragraph\": []\n          },\n          \"pills\": [],\n          \"cta\": \"Book a discovery call\"\n        }\n      }\n    ]\n  }\n]", "items": [{"name": "astro-content-section", "section_id": "section-a4", "props": {"main-heading": "We don't just consult. We embed.", "sur-heading": "Engineering Team Augmentation", "sub-heading": "We place silicon, firmware, and test engineers directly inside your hardware team, working in your tools and your schedules, not delivering a report and leaving.", "lists": {"numbered": [], "rich": [{"title": "What we do", "text": "Embed digital, analog, verification, firmware and test engineers into your hardware team to design, verify, and ship, not just review."}, {"title": "Why us", "text": "Engineers who have taken chips through tape-out, onboarded through the same protocols we use internally instead of ad hoc, with VP-level silicon leadership included."}, {"title": "Process", "text": "Discovery and scoping first, then engineers embedded in your team for delivery, finishing with a documented handoff under our Customer Handoff Protocol."}, {"title": "Engagement", "text": "Custom scoped engagements with a minimum of three months, always starting from a discovery call with our senior engineers."}, {"title": "Proof", "text": "23 tape-outs with first-pass silicon success on 19 of them, delivered under our Specification Freeze, Verification Sign-off and Tape-out Readiness protocols."}], "paragraph": []}, "pills": [], "cta": "Book a discovery call"}}]}]}], "prototype": {"base": "webagen.astrosynapse.ai/templates/website/prototype/", "pages": [{"file": "index.html", "label": "Home", "title": "Korvane Silicon · Purpose-built silicon for the intelligent edge"}, {"file": "solutions.html", "label": "Solutions", "title": "Solutions · Korvane Silicon"}, {"file": "products.html", "label": "Products", "title": "Products · Korvane Silicon"}, {"file": "use-cases.html", "label": "Use Cases", "title": "Use Cases · Korvane Silicon"}, {"file": "about.html", "label": "About", "title": "About · Korvane Silicon"}, {"file": "contact.html", "label": "Contact", "title": "Contact · Korvane Silicon"}, {"file": "privacy-policy.html", "label": "Privacy Policy", "title": "Privacy Policy · Korvane Silicon"}, {"file": "terms-of-sale.html", "label": "Terms of Sale", "title": "Terms of Sale · Korvane Silicon"}]}, "content": {"html": "<h1 id=\"korvane-silicon-company-document\">Korvane Silicon — Company Document<\/h1>\n<p><strong>Fabless Semiconductor Design House<\/strong> Korvane Silicon B.V. · Eindhoven, Netherlands Website: https://korvanesilicon.eu · Email: hello@korvanesilicon.eu<\/p>\n<blockquote>All company names, people, products, customers, figures and addresses in this document are fictional and created for demo purposes.<\/blockquote>\n<hr>\n<h2 id=\"table-of-contents\">Table of Contents<\/h2>\n<ol><li>[Company Overview](#1-company-overview)<\/li><li>[Mission &amp; Positioning](#2-mission--positioning)<\/li><li>[How We Operate](#3-how-we-operate)<\/li><li>[Our Process: Concept to Silicon](#4-our-process-concept-to-silicon)<\/li><li>[Solutions (Services)](#5-solutions-services)<\/li><li>[Products](#6-products)<\/li><li>[Use Cases](#7-use-cases)<\/li><li>[Supply Chain Resilience](#8-supply-chain-resilience)<\/li><li>[Quality &amp; Certifications](#9-quality--certifications)<\/li><li>[About the Company](#10-about-the-company)<\/li><li>[Strategy &amp; Direction](#11-strategy--direction)<\/li><li>[Contact &amp; Company Details](#12-contact--company-details)<\/li><\/ol>\n<hr>\n<h2 id=\"1-company-overview\">1. Company Overview<\/h2>\n<p>Korvane Silicon is a fabless semiconductor design house — part chip design studio, part product company. We design, verify, and ship low-power chips for the intelligent edge: AI inference accelerators, power management ICs, radar sensors, and secure microcontrollers. Alongside our own chips, we design custom silicon for companies whose products have outgrown off-the-shelf parts.<\/p>\n<p>We don't own a fab. We own the design, the verification, the test programs, and the relationship with every foundry and packaging partner in our supply chain — so our customers get one accountable team from first specification to volume production.<\/p>\n<p><strong>Core pillars:<\/strong> Efficiency · Reliability · Longevity<\/p>\n<p><strong>Focus areas:<\/strong> Edge AI · Power · Sensing · Security<\/p>\n<p><strong>At a glance:<\/strong><\/p>\n<div class=\"tablewrap\"><table><tbody><tr><td><strong>Founded<\/strong><\/td><td>2019<\/td><\/tr><tr><td><strong>Headquarters<\/strong><\/td><td>Eindhoven, Netherlands<\/td><\/tr><tr><td><strong>Design centers<\/strong><\/td><td>Eindhoven (digital &amp; system), Porto (analog &amp; RF)<\/td><\/tr><tr><td><strong>Team<\/strong><\/td><td>46 engineers, 61 people total<\/td><\/tr><tr><td><strong>Tape-outs completed<\/strong><\/td><td>23 (11 own products, 12 customer ASICs)<\/td><\/tr><tr><td><strong>Chips shipped<\/strong><\/td><td>9.4 million units to date<\/td><\/tr><tr><td><strong>Process nodes<\/strong><\/td><td>22nm FD-SOI, 40nm RF CMOS, 130nm BCD, 180nm<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2 id=\"2-mission-positioning\">2. Mission &amp; Positioning<\/h2>\n<blockquote>We design chips that do one thing exceptionally well.<\/blockquote>\n<p>General-purpose chips are built to sell into every market at once, which means every product that uses them pays for features it will never touch — in power, in board space, and in cost. We design silicon around a specific job and strip out everything else.<\/p>\n<p><strong>Our approach to silicon:<\/strong> Not every product needs a custom chip, and pretending otherwise is how hardware programs burn a year and a seven-figure budget. If an off-the-shelf part meets your power, cost, and supply requirements, we will tell you to buy it. Custom silicon earns its place only when volume, power budget, form factor, security, or supply risk make standard parts the more expensive option over the product's lifetime.<\/p>\n<p><strong>Our promise to clients:<\/strong> Tell us what you're building; we'll tell you honestly whether you need custom silicon at all, and what it would take to get there.<\/p>\n<p><strong>What we are not:<\/strong> We are not a foundry, a distributor, or a design-services body shop. Every engagement is led by senior engineers who have taken chips through tape-out, and every chip we design for a client goes through the same process as our own products.<\/p>\n<hr>\n<h2 id=\"3-how-we-operate\">3. How We Operate<\/h2>\n<h3 id=\"two-halves-that-feed-each-other\">Two halves that feed each other<\/h3>\n<p>We split our work into two halves:<\/p>\n<ul><li><strong>Design Services<\/strong> — we design custom ASICs and SoCs for clients, and supply verification, analog IP, packaging, test, and firmware expertise as stand-alone services.<\/li><li><strong>Products<\/strong> — we design and sell our own chips (Nerva N1, Ostra P8, Lumen R60, Vault M4) and the Tessel evaluation platform.<\/li><\/ul>\n<p>Client programs fund our research. The research becomes reusable IP — power domains, radar front ends, crypto engines, RISC-V subsystems. That silicon-proven IP goes into our own products, and our products prove it at volume before it goes back into client designs. Every block we license to a client has already shipped in production.<\/p>\n<h3 id=\"protocol-driven-delivery\">Protocol-driven delivery<\/h3>\n<p>Hardware punishes improvisation: a mistake found after tape-out costs months, not hours. Every program runs on a small set of internal protocols, refined across 23 tape-outs:<\/p>\n<ul><li>Specification Freeze Protocol<\/li><li>Architecture Review Protocol<\/li><li>Verification Sign-off Protocol<\/li><li>Tape-out Readiness Protocol<\/li><li>Silicon Bring-up Protocol<\/li><li>Qualification &amp; Release Protocol<\/li><li>Customer Handoff Protocol<\/li><\/ul>\n<h3 id=\"technology-stack\">Technology stack<\/h3>\n<p>The same toolchain and IP library serves our own products and our client programs, so what we build for ourselves and what we build for clients stays compatible:<\/p>\n<ul><li><strong>Processor cores:<\/strong> RISC-V (RV32 control cores, RV64 application cores with vector extensions)<\/li><li><strong>Digital design:<\/strong> SystemVerilog, UVM verification, formal property checking<\/li><li><strong>Analog &amp; RF:<\/strong> Custom ADCs, PLLs, LDOs, mmWave front ends<\/li><li><strong>Process nodes:<\/strong> 22nm FD-SOI, 40nm RF CMOS, 130nm BCD, 180nm mixed-signal<\/li><li><strong>Packaging:<\/strong> QFN, FCBGA, WLCSP, antenna-in-package, 2.5D chiplet integration<\/li><li><strong>Firmware:<\/strong> C and Rust, Zephyr RTOS support, in-house model compiler for Nerva<\/li><\/ul>\n<hr>\n<h2 id=\"4-our-process-concept-to-silicon\">4. Our Process: Concept to Silicon<\/h2>\n<p>From first conversation to production silicon in nine stages. A typical custom ASIC program takes 14 to 22 months; a derivative of existing Korvane IP can take as little as 9.<\/p>\n<ol><li><strong>Discovery.<\/strong> We review your product, volumes, power budget, and supply risks — and decide together whether custom silicon makes sense at all.<\/li><li><strong>Specification.<\/strong> Requirements become a frozen specification: functions, interfaces, power targets, package, cost per unit.<\/li><li><strong>Architecture.<\/strong> We partition the system, select IP blocks, choose the process node, and model power and performance before any design work starts.<\/li><li><strong>Design.<\/strong> RTL for digital blocks, schematics and layout for analog and RF, built from silicon-proven IP wherever possible.<\/li><li><strong>Verification.<\/strong> UVM testbenches, formal checks, and FPGA prototypes run until coverage targets are met — typically 70% of the pre-silicon effort.<\/li><li><strong>Physical design.<\/strong> Floorplanning, place and route, timing closure, and sign-off checks for the target foundry.<\/li><li><strong>Tape-out.<\/strong> The design goes to the foundry through a multi-project wafer for prototypes or a dedicated run for production.<\/li><li><strong>Bring-up &amp; characterization.<\/strong> First silicon is tested on our lab benches across voltage and temperature, with firmware ready on day one.<\/li><li><strong>Qualification &amp; production.<\/strong> Reliability testing, test program release, and handover to volume manufacturing with dual-sourced supply.<\/li><\/ol>\n<p><strong>What you get at every stage:<\/strong> a written gate review, an updated cost-per-unit estimate, and a clear go or no-go recommendation. You can stop at any gate and keep everything produced so far.<\/p>\n<hr>\n<h2 id=\"5-solutions-services\">5. Solutions (Services)<\/h2>\n<p>Silicon built around how your product actually works.<\/p>\n<h3 id=\"5-1-custom-asic-soc-design\">5.1 Custom ASIC &amp; SoC Design<\/h3>\n<p><strong>Your product's chip, designed from the specification up.<\/strong><\/p>\n<p>We design custom ASICs and RISC-V based SoCs from specification to tape-out, combining our silicon-proven IP library with new blocks built for your product. One chip can replace a board full of discrete parts — cutting power, area, and unit cost while making your design much harder to copy.<\/p>\n<ul><li>RISC-V SoC design<\/li><li>Mixed-signal ASICs<\/li><li>Spec to tape-out ownership<\/li><li>22nm to 180nm process nodes<\/li><li>Multi-project wafer prototyping<\/li><li>Cost-per-unit modeling from day one<\/li><\/ul>\n<p><strong>Typical engagement:<\/strong> 14–22 months; a derivative design starts at 9.<\/p>\n<h3 id=\"5-2-design-verification-dft\">5.2 Design Verification &amp; DFT<\/h3>\n<p><strong>Find the bug before the foundry does.<\/strong><\/p>\n<p>Verification is the majority of the work in any chip, and the stage most often underfunded. We build UVM testbenches, write formal properties, and run FPGA prototypes until coverage closes, and we insert design-for-test structures so every chip can be tested quickly in production.<\/p>\n<ul><li>UVM testbench development<\/li><li>Formal verification<\/li><li>FPGA prototyping<\/li><li>Scan and BIST insertion<\/li><li>Coverage closure and sign-off<\/li><\/ul>\n<h3 id=\"5-3-analog-mixed-signal-ip\">5.3 Analog &amp; Mixed-Signal IP<\/h3>\n<p><strong>Proven analog blocks, licensable or custom-built.<\/strong><\/p>\n<p>Our Porto design center builds the analog blocks most digital teams can't: data converters, clock generation, power regulation, and high-speed interfaces. License a block from our catalog or have one designed and ported to your process.<\/p>\n<ul><li>12-bit and 16-bit ADCs<\/li><li>Fractional-N PLLs<\/li><li>Low-noise LDOs and DC-DC converters<\/li><li>SerDes up to 16 Gbps<\/li><li>Process porting<\/li><\/ul>\n<h3 id=\"5-4-packaging-chiplet-integration\">5.4 Packaging &amp; Chiplet Integration<\/h3>\n<p><strong>The package is part of the design.<\/strong><\/p>\n<p>We design the package alongside the die — selecting the format, modeling thermal and signal integrity, and managing the packaging partner. For larger systems, we integrate multiple dies into a single 2.5D chiplet package.<\/p>\n<ul><li>QFN, FCBGA and WLCSP<\/li><li>Antenna-in-package for mmWave<\/li><li>2.5D chiplet integration<\/li><li>Thermal and signal-integrity modeling<\/li><li>Packaging partner management<\/li><\/ul>\n<h3 id=\"5-5-test-qualification-reliability\">5.5 Test, Qualification &amp; Reliability<\/h3>\n<p><strong>Every chip proven before it ships.<\/strong><\/p>\n<p>We develop the production test programs, run reliability qualification, and handle failure analysis when something comes back from the field. Automotive programs are qualified to AEC-Q100.<\/p>\n<ul><li>ATE test program development<\/li><li>AEC-Q100 qualification<\/li><li>HTOL, ESD and latch-up testing<\/li><li>Characterization across voltage and temperature<\/li><li>Failure analysis<\/li><\/ul>\n<h3 id=\"5-6-embedded-firmware-sdks\">5.6 Embedded Firmware &amp; SDKs<\/h3>\n<p><strong>Silicon is only as good as the software that runs it.<\/strong><\/p>\n<p>Every chip we design ships with working firmware on day one of bring-up: bootloaders, drivers, board support packages, and Zephyr RTOS integration. For AI hardware, we build the model compilers that turn trained networks into efficient on-chip code.<\/p>\n<ul><li>Bootloaders and secure boot<\/li><li>Device drivers and BSPs<\/li><li>Zephyr RTOS support<\/li><li>Model compiler toolchains<\/li><li>Reference applications<\/li><\/ul>\n<h3 id=\"5-7-lifecycle-obsolescence-management\">5.7 Lifecycle &amp; Obsolescence Management<\/h3>\n<p><strong>When your critical part goes end-of-life, we build its replacement.<\/strong><\/p>\n<p>Industrial, medical, and rail products live for decades; the chips inside them often don't. We design pin-compatible, drop-in replacements for discontinued parts and guarantee long-term supply so a single end-of-life notice never stops your production line.<\/p>\n<ul><li>Pin-compatible drop-in replacements<\/li><li>15-year supply commitments<\/li><li>Last-time-buy planning<\/li><li>Component risk audits<\/li><\/ul>\n<h3 id=\"5-8-engineering-team-augmentation\">5.8 Engineering Team Augmentation<\/h3>\n<p><strong>We don't just consult. We embed.<\/strong><\/p>\n<p>We place silicon, firmware, and test engineers directly inside your hardware team, working in your tools and your schedules — not delivering a report and leaving.<\/p>\n<div class=\"tablewrap\"><table><tbody><tr><td><strong>What we do<\/strong><\/td><td>Embed digital, analog, verification, firmware and test engineers into your hardware team to design, verify, and ship — not just review.<\/td><\/tr><tr><td><strong>Why us<\/strong><\/td><td>Engineers who have taken chips through tape-out, onboarded through the same protocols we use internally (Specification Freeze, Tape-out Readiness, Customer Handoff) instead of ad hoc. Includes VP-level silicon leadership.<\/td><\/tr><tr><td><strong>Process<\/strong><\/td><td>Discovery → Scoping → Embedded delivery → Handoff<\/td><\/tr><tr><td><strong>Engagement<\/strong><\/td><td>Custom scoped, minimum three months, starting from a discovery call<\/td><\/tr><tr><td><strong>Proof<\/strong><\/td><td>23 tape-outs, first-pass silicon success on 19 of them, delivered under protocol: Specification Freeze, Architecture Review, Verification Sign-off, Tape-out Readiness, Silicon Bring-up, Qualification &amp; Release<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2 id=\"6-products\">6. Products<\/h2>\n<p>Chips we design and ship ourselves.<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>#<\/th><th>Product<\/th><th>Status<\/th><th>One-liner<\/th><th>Link<\/th><\/tr><\/thead><tbody><tr><td>001<\/td><td>Nerva N1<\/td><td>In Production<\/td><td>Edge AI inference accelerator, 8 TOPS at under one watt<\/td><td>https://korvanesilicon.eu/nerva<\/td><\/tr><tr><td>002<\/td><td>Ostra P8<\/td><td>In Production<\/td><td>Eight-rail power management IC for battery-powered devices<\/td><td>https://korvanesilicon.eu/ostra<\/td><\/tr><tr><td>003<\/td><td>Lumen R60<\/td><td>Engineering Samples<\/td><td>60 GHz radar sensor SoC for presence, gesture and vital signs<\/td><td>https://korvanesilicon.eu/lumen<\/td><\/tr><tr><td>004<\/td><td>Vault M4<\/td><td>Waitlist<\/td><td>Secure microcontroller with post-quantum cryptography<\/td><td>https://korvanesilicon.eu/vault<\/td><\/tr><tr><td>005<\/td><td>Tessel Kit<\/td><td>Live<\/td><td>Modular evaluation platform for every Korvane chip<\/td><td>https://korvanesilicon.eu/tessel<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"6-1-nerva-n1-in-production\">6.1 Nerva N1 — In Production<\/h3>\n<p><strong>Run vision AI on the device, not in the cloud.<\/strong><\/p>\n<p><strong>Problem:<\/strong> Smart cameras, inspection systems, and robots need to run neural networks in real time, but GPUs draw too much power and cloud inference adds latency, bandwidth cost, and privacy risk.<\/p>\n<p><strong>Solution:<\/strong> Nerva N1 is a dedicated inference accelerator that runs modern vision and audio models locally at 8 TOPS while drawing under one watt — small enough to sit next to the image sensor and efficient enough to run on battery or PoE power.<\/p>\n<p><strong>How it works:<\/strong><\/p>\n<ol><li>Train your model in PyTorch or TensorFlow as usual<\/li><li>Compile it with the Nerva toolchain to INT8 or INT4<\/li><li>Connect Nerva N1 to your host over PCIe or USB<\/li><li>Stream camera frames directly in through MIPI CSI-2<\/li><li>Your model runs on-device at under one watt<\/li><\/ol>\n<p><strong>Key specifications:<\/strong><\/p>\n<div class=\"tablewrap\"><table><tbody><tr><td>Peak performance<\/td><td>8 TOPS (INT8), 16 TOPS (INT4)<\/td><\/tr><tr><td>Typical power<\/td><td>0.9 W at full load<\/td><\/tr><tr><td>On-chip memory<\/td><td>4 MB SRAM<\/td><\/tr><tr><td>Control core<\/td><td>RISC-V RV32<\/td><\/tr><tr><td>Interfaces<\/td><td>MIPI CSI-2 (2× 4-lane), PCIe Gen3 x1, USB 3.2<\/td><\/tr><tr><td>Process<\/td><td>22nm FD-SOI<\/td><\/tr><tr><td>Package<\/td><td>9 × 9 mm FCBGA<\/td><\/tr><tr><td>Temperature range<\/td><td>−40 °C to +105 °C<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>What sets it apart:<\/strong> Unlike general-purpose GPUs and NPUs bundled into application processors, Nerva N1 keeps the full model in on-chip memory, so it never stalls waiting on external DRAM. That's where most of its power advantage comes from, and why it delivers consistent frame rates with no thermal throttling.<\/p>\n<p><strong>Proof:<\/strong> Lyrafield, a maker of industrial inspection cameras, moved defect detection from an embedded GPU module to Nerva N1, cutting camera power from 11 W to 3.2 W and removing the fan from its enclosure entirely.<\/p>\n<p><strong>Key features:<\/strong> 8 TOPS · Sub-1 W · INT4/INT8 · On-chip SRAM · RISC-V control core<\/p>\n<h3 id=\"6-2-ostra-p8-in-production\">6.2 Ostra P8 — In Production<\/h3>\n<p><strong>Eight power rails. One chip. Two microamps.<\/strong><\/p>\n<p><strong>Problem:<\/strong> Battery-powered industrial and medical devices often need six to ten separate voltage regulators, each adding board area, cost, and standby current that drains batteries in storage.<\/p>\n<p><strong>Solution:<\/strong> Ostra P8 integrates four buck converters and four LDOs into a single programmable power management IC with a quiescent current of just 2 µA, configured over I²C or PMBus and stored in one-time-programmable memory.<\/p>\n<ul><li><strong>Integrate<\/strong> — Four high-efficiency buck converters and four low-noise LDOs replace up to eight discrete regulators.<\/li><li><strong>Program<\/strong> — Voltages, sequencing, and fault limits set over I²C/PMBus, then locked into on-chip OTP memory.<\/li><li><strong>Monitor<\/strong> — Built-in telemetry reports voltage, current, and temperature on every rail.<\/li><li><strong>Protect<\/strong> — Over-voltage, over-current, and thermal shutdown on each rail independently.<\/li><\/ul>\n<p><strong>Key specifications:<\/strong> 2.7–5.5 V input · up to 94% efficiency · 2 µA quiescent current · 130nm BCD · 4 × 4 mm WLCSP<\/p>\n<p><strong>Proof:<\/strong> Brenholt Elektro, an industrial drives manufacturer, replaced seven discrete regulators with a single Ostra P8, cutting power-section BOM cost by 31% and board area by 44%.<\/p>\n<p><strong>Key features:<\/strong> 8 rails · 2 µA quiescent · I²C/PMBus · On-chip telemetry · OTP configuration<\/p>\n<h3 id=\"6-3-lumen-r60-engineering-samples\">6.3 Lumen R60 — Engineering Samples<\/h3>\n<p><strong>See presence, motion and breathing — without a camera.<\/strong><\/p>\n<p>Lumen R60 is a 60 GHz radar sensor SoC that detects people, gestures, and vital signs through plastic and fabric, with no camera and no images to protect.<\/p>\n<ul><li><strong>Sense<\/strong> — Three transmit and four receive channels with integrated antennas produce a 4D point cloud of range, speed, and angle.<\/li><li><strong>Process<\/strong> — An on-chip DSP and RISC-V core run detection algorithms locally, so only results leave the chip.<\/li><li><strong>Privacy<\/strong> — Radar sees movement, not faces, making it suitable for bathrooms, bedrooms, and care homes where cameras are unacceptable.<\/li><li><strong>Applications<\/strong> — In-cabin child presence detection, elderly fall detection, smart lighting, and touchless controls.<\/li><\/ul>\n<p><strong>Key specifications:<\/strong> 57–64 GHz · 3 TX / 4 RX · antenna-in-package · up to 15 m range · 40nm RF CMOS · AEC-Q100 qualification in progress<\/p>\n<p><strong>Key features:<\/strong> 60 GHz radar · 4D point cloud · On-chip DSP · Antenna-in-package · Privacy by design<\/p>\n<h3 id=\"6-4-vault-m4-waitlist\">6.4 Vault M4 — Waitlist<\/h3>\n<p><strong>A microcontroller ready for the quantum era.<\/strong><\/p>\n<p>Vault M4 is a secure RISC-V microcontroller with a hardware root of trust and built-in post-quantum cryptography, designed for connected devices that must stay secure for fifteen years or more.<\/p>\n<ul><li><strong>Built for long-lived devices<\/strong> — Smart meters, industrial controllers, and medical devices stay in the field for 15+ years. Vault M4 implements the post-quantum algorithms ML-KEM and ML-DSA in hardware, so devices shipped today stay secure after classical encryption is broken.<\/li><li><strong>Hardware root of trust<\/strong> — Device keys are generated from a physically unclonable function and never stored in memory. Secure boot, encrypted firmware updates, and an active tamper-detection mesh are built in.<\/li><li><strong>Coming next<\/strong> — Pre-certified firmware stacks for EU Cyber Resilience Act compliance, and a secure provisioning service that injects keys during production testing.<\/li><\/ul>\n<p><strong>Key specifications:<\/strong> RISC-V RV32 at 200 MHz · 1 MB flash · 256 KB SRAM · hardware PQC engine · PUF key storage · 22nm FD-SOI<\/p>\n<p><strong>Key features:<\/strong> Post-quantum crypto · PUF root of trust · Secure boot · Tamper detection · CRA-ready<\/p>\n<h3 id=\"6-5-tessel-kit-live\">6.5 Tessel Kit — Live<\/h3>\n<p><strong>Prototype with every Korvane chip on one board.<\/strong><\/p>\n<p>Tessel is a modular evaluation platform: one carrier board, plug-in modules for each Korvane chip, and a desktop app for configuration, telemetry, and firmware flashing. Prototype a vision sensor, a radar node, or a secure gateway in an afternoon instead of designing a custom board first.<\/p>\n<ul><li>Carrier board with USB-C power and debug<\/li><li>Plug-in modules for Nerva N1, Ostra P8, Lumen R60 and Vault M4<\/li><li>Raspberry Pi and Arduino-compatible headers<\/li><li>Tessel Studio desktop app for Windows, macOS and Linux<\/li><li>Reference designs and schematics included<\/li><\/ul>\n<p><strong>Key features:<\/strong> Modular · Plug-in chip modules · Tessel Studio app · Open reference designs<\/p>\n<hr>\n<h2 id=\"7-use-cases\">7. Use Cases<\/h2>\n<p>Where purpose-built silicon actually pays off — organised by application, not by spec sheet.<\/p>\n<h3 id=\"7-1-by-application\">7.1 By Application<\/h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Application<\/th><th>What our silicon does<\/th><\/tr><\/thead><tbody><tr><td><strong>Edge vision<\/strong><\/td><td>Cameras detect defects, read labels, and count objects locally, with no video leaving the device.<\/td><\/tr><tr><td><strong>Industrial motor control<\/strong><\/td><td>Precise, efficient drive control with integrated power stages and real-time fault protection.<\/td><\/tr><tr><td><strong>Battery management<\/strong><\/td><td>Every cell monitored and balanced, extending battery life and catching failures before they become hazards.<\/td><\/tr><tr><td><strong>Smart metering<\/strong><\/td><td>Meters that stay secure for fifteen years, protected against today's attacks and tomorrow's quantum computers.<\/td><\/tr><tr><td><strong>In-cabin sensing<\/strong><\/td><td>Radar detects a child left in a car, through blankets and seats, without a camera.<\/td><\/tr><tr><td><strong>Predictive maintenance<\/strong><\/td><td>Vibration and acoustic models run on the sensor, flagging bearing wear weeks before failure.<\/td><\/tr><tr><td><strong>Medical wearables<\/strong><\/td><td>Months of continuous monitoring on a coin cell, thanks to microamp-level standby power.<\/td><\/tr><tr><td><strong>Drone flight control<\/strong><\/td><td>Obstacle detection and navigation processed onboard, within the tight power budget of a small airframe.<\/td><\/tr><tr><td><strong>Secure IoT gateways<\/strong><\/td><td>Hardware root of trust and encrypted updates for every device connected to the network.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"7-2-by-industry\">7.2 By Industry<\/h3>\n<p>Low-power, long-life silicon, applied across sectors:<\/p>\n<ul><li><strong>Automotive<\/strong> — In-cabin radar sensing and power management, qualified to AEC-Q100 for vehicle environments.<\/li><li><strong>Industrial automation<\/strong> — Machine vision, motor control, and predictive maintenance on the factory floor.<\/li><li><strong>Energy<\/strong> — Secure smart meters, battery storage systems, and grid-edge monitoring with fifteen-year supply.<\/li><li><strong>Medical devices<\/strong> — Wearables and patient monitors running for months on a single small battery.<\/li><li><strong>Agritech<\/strong> — Solar-powered field sensors and vision systems that run for seasons without maintenance.<\/li><li><strong>Smart buildings<\/strong> — Privacy-preserving occupancy sensing that cuts lighting and HVAC energy use.<\/li><\/ul>\n<h3 id=\"7-3-silicon-in-industrial-systems\">7.3 Silicon in Industrial Systems<\/h3>\n<p>Not every product needs a custom chip, and pretending otherwise is how hardware programs fail.<\/p>\n<p><strong>The right approach:<\/strong> Where an off-the-shelf part meets the power, cost, and supply requirements, that part wins. Custom silicon earns its place only where standard parts can't meet the power budget, take up too much board space, cost too much at volume, or carry an unacceptable supply risk. In industrial systems especially, the cost of getting it wrong is high: a single discontinued component can halt a production line built to run for twenty years.<\/p>\n<p>Applied well, this looks like three tiers of integration rather than custom silicon everywhere at once:<\/p>\n<p><strong>Tier 1 — Consolidation &amp; supply security<\/strong> Discrete power regulators, interface chips, and glue logic consolidated into a single standard Korvane part or a small custom ASIC. The board gets smaller, the bill of materials gets shorter, and every critical component comes with a fifteen-year supply commitment. No machine learning, no new architecture — just fewer parts that can go end-of-life.<\/p>\n<p><strong>Tier 2 — Intelligence at the sensor<\/strong><\/p>\n<ul><li>Vision, vibration, and acoustic models running directly on the sensor node, so only events — not raw data — travel over the network.<\/li><li>Radar-based presence and motion detection replacing cameras wherever privacy matters.<\/li><li>Local decision-making that keeps working when the network connection drops.<\/li><\/ul>\n<p><strong>Tier 3 — Secure, self-managing fleets<\/strong><\/p>\n<ul><li>Hardware root of trust in every device, so only authenticated firmware ever runs.<\/li><li>Post-quantum encrypted over-the-air updates across fleets of thousands of devices.<\/li><li>On-chip telemetry that reports power, temperature, and health, so failing devices are replaced before they fail.<\/li><li>Extension into fully custom SoCs that combine sensing, inference, power, and security on a single die, once volumes justify it.<\/li><\/ul>\n<h3 id=\"7-4-emerging-capabilities\">7.4 Emerging Capabilities<\/h3>\n<ul><li><strong>Chiplet systems<\/strong> — UCIe-based chiplet integration, so customers can combine Korvane dies with their own in one package instead of designing a full SoC.<\/li><li><strong>RISC-V vector compute<\/strong> — Application-class RISC-V cores with vector extensions for signal processing and AI workloads too large for a microcontroller.<\/li><li><strong>Analog in-memory compute<\/strong> — Research into computing neural network layers directly inside memory arrays, targeting a further 10× efficiency gain over Nerva N1.<\/li><\/ul>\n<p>Don't see your application? That usually means the right chip hasn't been designed yet — tell us what you're building.<\/p>\n<hr>\n<h2 id=\"8-supply-chain-resilience\">8. Supply Chain Resilience<\/h2>\n<p><strong>Dual-sourced silicon. Supported for fifteen years.<\/strong><\/p>\n<p>The chip shortage of the early 2020s stopped production lines for want of parts costing less than a euro. Every Korvane product is designed to avoid single points of failure:<\/p>\n<ul><li><strong>Two foundries per process node<\/strong> — every production design is qualified at a primary and a secondary foundry, with at least one in Europe.<\/li><li><strong>Two packaging and test partners<\/strong> — packaging and final test qualified at sites on two continents.<\/li><li><strong>Fifteen-year longevity commitment<\/strong> — every standard product carries a guaranteed minimum production life of fifteen years from release.<\/li><li><strong>Buffer stock programs<\/strong> — customers on long-term agreements can hold dedicated wafer and finished-goods stock in bonded storage.<\/li><li><strong>EU Chips Act alignment<\/strong> — our design and qualification activities are based in the EU, supporting customers with European sourcing requirements.<\/li><\/ul>\n<hr>\n<h2 id=\"9-quality-certifications\">9. Quality &amp; Certifications<\/h2>\n<ul><li>ISO 9001 certified quality management system<\/li><li>ISO 26262 functional safety process for automotive programs (ASIL-B capable)<\/li><li>AEC-Q100 qualification for automotive products<\/li><li>IEC 62443 secure development lifecycle for industrial security products<\/li><li>Full traceability from wafer lot to individual unit<\/li><li>Zero-defect program with 8D failure analysis reporting<\/li><\/ul>\n<hr>\n<h2 id=\"10-about-the-company\">10. About the Company<\/h2>\n<h3 id=\"our-story\">Our story<\/h3>\n<p>Korvane Silicon was founded in 2019 by four engineers who had spent their careers inside large semiconductor companies, watching good product ideas get cancelled because they didn't fit a roadmap built for smartphones. They started Korvane to design the chips those large companies wouldn't: low-volume, long-life, highly specific silicon for industrial, medical, and automotive products.<\/p>\n<p>The first years were funded entirely by custom ASIC work for clients. In 2022, the power management IP built for those clients became Ostra P8, our first product. Nerva N1 followed in 2024.<\/p>\n<h3 id=\"leadership\">Leadership<\/h3>\n<ul><li><strong>Ilse Varendonck<\/strong> — Co-founder &amp; CEO. Previously led mixed-signal product lines for industrial markets.<\/li><li><strong>Tomás Revelo<\/strong> — Co-founder &amp; CTO. Digital architect behind three generations of low-power SoCs.<\/li><li><strong>Marta Quintela<\/strong> — Co-founder &amp; Head of Analog, Porto. Specialist in data converters and mmWave front ends.<\/li><li><strong>Joris Abbenhuis<\/strong> — Co-founder &amp; VP Operations. Runs foundry, packaging, and supply chain relationships.<\/li><\/ul>\n<h3 id=\"how-we-work\">How we work<\/h3>\n<ul><li>Small, senior teams: every program is led by an engineer with at least two tape-outs behind them.<\/li><li>Honest recommendations: we turn down programs where custom silicon isn't the right answer.<\/li><li>Long relationships: our first client is still a client, now on its third chip.<\/li><\/ul>\n<h3 id=\"careers\">Careers<\/h3>\n<p>We hire digital designers, verification engineers, analog and RF designers, firmware engineers, and test engineers in Eindhoven and Porto. Open roles are published on our website.<\/p>\n<hr>\n<h2 id=\"11-strategy-direction\">11. Strategy &amp; Direction<\/h2>\n<p>The near-term plan is straightforward:<\/p>\n<ol><li>Grow a small, senior design team across Eindhoven and Porto.<\/li><li>Fund it through custom ASIC programs and design services.<\/li><li>Use that runway to expand our own product families — Nerva, Ostra, Lumen, and Vault — each eventually run as an independent business unit.<\/li><li>Launch the Nerva N2 and Vault M4 in production by 2028.<\/li><\/ol>\n<p>We are optimising for first-pass silicon success and long customer relationships, not for headcount.<\/p>\n<hr>\n<h2 id=\"12-contact-company-details\">12. Contact &amp; Company Details<\/h2>\n<p><strong>Korvane Silicon B.V.<\/strong> Registered in Eindhoven, Netherlands Kalkovenweg 117, 5652 RT Eindhoven, Netherlands<\/p>\n<p><strong>Porto Design Center<\/strong> Rua das Fundições 48, 4100-321 Porto, Portugal<\/p>\n<ul><li><strong>Email:<\/strong> hello@korvanesilicon.eu<\/li><li><strong>Sales &amp; samples:<\/strong> sales@korvanesilicon.eu<\/li><li><strong>Website:<\/strong> https://korvanesilicon.eu<\/li><li><strong>LinkedIn:<\/strong> https://www.linkedin.com/company/korvane-silicon/<\/li><li><strong>GitHub:<\/strong> https://github.com/korvanesilicon<\/li><\/ul>\n<p><strong>Engagements<\/strong> start with a discovery call. The website contact form asks for: first name, last name, work email, company, expected annual volume, and what you're building.<\/p>\n<p><strong>Samples &amp; evaluation kits<\/strong> can be requested through the product pages; engineering samples require a short application.<\/p>\n<p><strong>Legal:<\/strong> Privacy Policy, Terms of Sale, and Conflict Minerals Policy are published on the website.<\/p>\n<p>© Korvane Silicon B.V. Eindhoven, Netherlands.<\/p>", "toc": [{"id": "korvane-silicon-company-document", "title": "Korvane Silicon — Company Document", "level": 1}, {"id": "table-of-contents", "title": "Table of Contents", "level": 2}, {"id": "1-company-overview", "title": "1. Company Overview", "level": 2}, {"id": "2-mission-positioning", "title": "2. Mission & Positioning", "level": 2}, {"id": "3-how-we-operate", "title": "3. How We Operate", "level": 2}, {"id": "two-halves-that-feed-each-other", "title": "Two halves that feed each other", "level": 3}, {"id": "protocol-driven-delivery", "title": "Protocol-driven delivery", "level": 3}, {"id": "technology-stack", "title": "Technology stack", "level": 3}, {"id": "4-our-process-concept-to-silicon", "title": "4. Our Process: Concept to Silicon", "level": 2}, {"id": "5-solutions-services", "title": "5. Solutions (Services)", "level": 2}, {"id": "5-1-custom-asic-soc-design", "title": "5.1 Custom ASIC & SoC Design", "level": 3}, {"id": "5-2-design-verification-dft", "title": "5.2 Design Verification & DFT", "level": 3}, {"id": "5-3-analog-mixed-signal-ip", "title": "5.3 Analog & Mixed-Signal IP", "level": 3}, {"id": "5-4-packaging-chiplet-integration", "title": "5.4 Packaging & Chiplet Integration", "level": 3}, {"id": "5-5-test-qualification-reliability", "title": "5.5 Test, Qualification & Reliability", "level": 3}, {"id": "5-6-embedded-firmware-sdks", "title": "5.6 Embedded Firmware & SDKs", "level": 3}, {"id": "5-7-lifecycle-obsolescence-management", "title": "5.7 Lifecycle & Obsolescence Management", "level": 3}, {"id": "5-8-engineering-team-augmentation", "title": "5.8 Engineering Team Augmentation", "level": 3}, {"id": "6-products", "title": "6. Products", "level": 2}, {"id": "6-1-nerva-n1-in-production", "title": "6.1 Nerva N1 — In Production", "level": 3}, {"id": "6-2-ostra-p8-in-production", "title": "6.2 Ostra P8 — In Production", "level": 3}, {"id": "6-3-lumen-r60-engineering-samples", "title": "6.3 Lumen R60 — Engineering Samples", "level": 3}, {"id": "6-4-vault-m4-waitlist", "title": "6.4 Vault M4 — Waitlist", "level": 3}, {"id": "6-5-tessel-kit-live", "title": "6.5 Tessel Kit — Live", "level": 3}, {"id": "7-use-cases", "title": "7. Use Cases", "level": 2}, {"id": "7-1-by-application", "title": "7.1 By Application", "level": 3}, {"id": "7-2-by-industry", "title": "7.2 By Industry", "level": 3}, {"id": "7-3-silicon-in-industrial-systems", "title": "7.3 Silicon in Industrial Systems", "level": 3}, {"id": "7-4-emerging-capabilities", "title": "7.4 Emerging Capabilities", "level": 3}, {"id": "8-supply-chain-resilience", "title": "8. Supply Chain Resilience", "level": 2}, {"id": "9-quality-certifications", "title": "9. Quality & Certifications", "level": 2}, {"id": "10-about-the-company", "title": "10. About the Company", "level": 2}, {"id": "our-story", "title": "Our story", "level": 3}, {"id": "leadership", "title": "Leadership", "level": 3}, {"id": "how-we-work", "title": "How we work", "level": 3}, {"id": "careers", "title": "Careers", "level": 3}, {"id": "11-strategy-direction", "title": "11. Strategy & Direction", "level": 2}, {"id": "12-contact-company-details", "title": "12. Contact & Company Details", "level": 2}], "source": "webagen.astrosynapse.ai/templates/website/content.md"}}, {"id": "webshop-template", "type": "template", "title": "Webshop · Stride", "label": "Webshop", "brand": "Stride", "path": "webagen.astrosynapse.ai/templates/webshop", "description": "A webshop the agent builds as the shopper asks: homepage, categories, products, comparisons, bag and checkout. Demo store: Stride, a fictional sports footwear shop shipping from Zagreb.", "readme": "<p>A webshop the agent builds as the shopper asks: homepage, categories, products, comparisons, bag and checkout. Demo store: Stride, a fictional sports footwear shop shipping from Zagreb.<\/p>\n<ul><li><code>design.md<\/code> — colours, type, spacing, graphics and UI elements (white, navy, orange, Barlow Condensed)<\/li><li><code>components.md<\/code> — the sections the agent composes layouts from (ruleset + JSON), prefix <code>stride-<\/code><\/li><li><code>content.md<\/code> — default store content (STORE INFO): products, prices, sizes, reviews, shipping and returns<\/li><li><code>prototype/<\/code> — the full webshop as a classic multi-page site (HTML pages, <code>styles.css<\/code>, <code>main.js<\/code>); the main page shows it. Pages are built from the components and example layouts. <code>data.js<\/code> maps prompts to pages (routes) and holds the props for the bag, quick view, search and menu, which <code>components.js<\/code> (a copy of <code>webagen.astrosynapse.ai/renderers/stride.js<\/code>) renders in the browser. The bag lives in localStorage; checkout sends nothing<\/li><li><code>layouts/<\/code> — example flows: what the agent sends back, step by step, for typical shopping journeys<\/li><li><code>prompts/<\/code> — AI instructions specific to this template (empty for now)<\/li><\/ul>\n<p>Coded prototype: <code>astro-webshop<\/code> repo (<code>#/stride/sections<\/code> shows every section live).<\/p>", "design": {"title": "Stride design", "source": "webagen.astrosynapse.ai/templates/webshop/design.md", "intro": "<p>The look of the Stride webshop: a white ground, deep navy ink and one warm orange accent, with a condensed uppercase display face. Every component reads these tokens; none hard-code a colour, font or radius. Source: <code>astro-webshop/css/tokens.css<\/code>, <code>components.css<\/code> and <code>layouts.css<\/code>.<\/p>", "sections": [{"id": "principles", "title": "Principles", "html": "<ul><li>One accent. Orange is for the primary action and the active state, never for decoration<\/li><li>Products first: photography carries the colour, the interface stays neutral<\/li><li>Scan, then read: a condensed uppercase display for headings, plain Inter for everything you read<\/li><li>States are shown, not hinted: selected options get a border and inner ring, sold-out stays visible and struck through, low stock gets a dot<\/li><li>Prices always include VAT and use the store's format: <code>€139,00<\/code><\/li><\/ul>", "blocks": [], "kit": null}, {"id": "colour", "title": "Colour", "html": "<p>Light is the default; dark follows the system setting or the theme toggle. Text on the accent is always white.<\/p>", "blocks": [{"kind": "colors", "data": {"modes": {"light": {"--bg": "#ffffff", "--bg-2": "#f4f3f0", "--surface": "#ffffff", "--fg": "#13213a", "--fg-2": "#4b556b", "--muted": "#7b8294", "--line": "#e3e1dc", "--line-strong": "#c9c6bf", "--accent": "#f26a21", "--accent-soft": "#fdebe0", "--accent-2": "#13213a", "--sale": "#d6341f", "--ok": "#1f7a4d", "--warn": "#9a5a12", "--err": "#b42318", "--star": "#e8a317", "--img-bg": "#f4f3f0"}, "dark": {"--bg": "#0f1524", "--bg-2": "#161d2f", "--surface": "#161d2f", "--fg": "#eef0f5", "--fg-2": "#c3c8d6", "--muted": "#8c93a6", "--line": "#2a3246", "--line-strong": "#3a4359", "--accent": "#ff7a33", "--accent-soft": "#3a2416", "--accent-2": "#eef0f5", "--sale": "#d6341f", "--ok": "#1f7a4d", "--warn": "#9a5a12", "--err": "#b42318", "--star": "#e8a317", "--img-bg": "#1c2436"}}, "usage": {"--bg": "Page background", "--bg-2": "Bands, editorial blocks, image placeholders", "--surface": "Cards, drawers, modals", "--fg": "Headings and body text", "--fg-2": "Secondary text", "--muted": "Hints, counts, meta", "--line": "Dividers and input borders", "--line-strong": "Hover borders", "--accent": "Primary buttons, active states, links", "--accent-soft": "Soft badges and highlights", "--accent-2": "Announcement bar, secondary buttons", "--sale": "Sale price and discount badge", "--ok": "In stock, verified", "--warn": "Low stock", "--err": "Errors, sold out", "--star": "Rating stars", "--img-bg": "Behind product photos"}}}], "kit": null}, {"id": "typography", "title": "Typography", "html": "", "blocks": [{"kind": "type", "data": [{"name": "Display", "family": "Barlow Condensed", "weight": 700, "size": "44–88 px", "case": "uppercase", "tracking": "-0.01em", "sample": "Built for the long way round", "use": "Heroes and chapter titles"}, {"name": "Heading 1", "family": "Barlow Condensed", "weight": 700, "size": "34–52 px", "case": "uppercase", "tracking": "-0.01em", "sample": "Running", "use": "Page titles, product names"}, {"name": "Heading 2", "family": "Barlow Condensed", "weight": 700, "size": "26–34 px", "case": "uppercase", "tracking": "-0.01em", "sample": "Best sellers", "use": "Section titles"}, {"name": "Lead", "family": "Inter", "weight": 400, "size": "18 px", "case": "none", "tracking": "0", "sample": "Waterproof trail shoes, merino socks and gaiters, in stock and shipping today.", "use": "Intros under titles"}, {"name": "Body", "family": "Inter", "weight": 400, "size": "16 px", "case": "none", "tracking": "0", "sample": "The engineered mesh upper is thinner than last year's but holds the midfoot better.", "use": "Descriptions, reviews"}, {"name": "Eyebrow", "family": "JetBrains Mono", "weight": 500, "size": "12 px", "case": "uppercase", "tracking": "0.08em", "sample": "Trail season", "use": "Labels above titles, spec groups"}, {"name": "Price", "family": "Inter", "weight": 700, "size": "16–24 px", "case": "none", "tracking": "0", "sample": "€139,00", "use": "Tabular figures, comma decimals"}]}], "kit": null}, {"id": "spacing-radius-and-shadow", "title": "Spacing, radius and shadow", "html": "", "blocks": [{"kind": "scale", "data": {"Spacing": {"s-1": "4px", "s-2": "8px", "s-3": "12px", "s-4": "16px", "s-5": "24px", "s-6": "32px", "s-7": "48px", "s-8": "64px", "s-9": "96px"}, "Radius": {"r-sm": "3px", "r": "6px", "r-lg": "10px", "r-pill": "999px"}, "Layout": {"container": "1320px", "gutter": "16px", "header": "64px", "announcement": "36px"}}}], "kit": null}, {"id": "graphics", "title": "Graphics", "html": "<ul><li>Photography only, no illustrations. Every image is an Unsplash photo id from the store info<\/li><li>Product images: the first is a packshot on a light ground, the rest are in context (on foot, on the trail). Cards crop to 4:5 and swap to the second photo on hover<\/li><li>Heroes and editorial blocks use one landscape photo (16:9 or 3:2); category tiles are square with a dark gradient at the bottom and the label in white display type<\/li><li>Icons are 24 px line icons with a 2 px stroke (Tabler style), in the text colour; the accent is used only on trust icons<\/li><li>No patterns, textures or gradients except the dark scrim under text on photos<\/li><\/ul>", "blocks": [], "kit": null}, {"id": "ui-elements", "title": "UI elements", "html": "<p>The shared building blocks every component is made of, drawn with the live Stride CSS. Use the theme toggle to see them in dark mode.<\/p>", "blocks": [], "kit": "stride-kit"}]}, "components": {"title": "Stride UI components", "source": "webagen.astrosynapse.ai/templates/webshop/components.md", "shared": [{"title": "Shared rules", "id": "shared-shared-rules", "rules": ["Every block sends full props: the frontend has no product data of its own, so titles, prices, images and ratings all come from you", "Use only STORE INFO for products, prices, sizes, ratings, reviews and quotes; never invent a product, price or review", "Use only CART INFO for bag contents and totals, SESSION INFO for recently viewed and compared products, and ORDER INFO for a placed order; the frontend sends these with the query, and you never invent or change them", "Prices are numbers in EUR without a currency sign, for example <code>139<\/code> or <code>24.9<\/code>", "Inside text, write amounts the way the store shows them: <code>€75<\/code>, <code>€4,90<\/code>", "Send <code>compare-at<\/code> only when the product is on sale, and only when it is higher than <code>price<\/code>", "Images are Unsplash photo ids from STORE INFO (for example <code>photo-1542291026-7eec264c27ff<\/code>) or full <code>https://<\/code> URLs", "<code>badges<\/code> only take these values: <code>new<\/code>, <code>bestseller<\/code>, <code>sale<\/code>, <code>low-stock<\/code>, <code>sold-out<\/code>", "<code>rating.avg<\/code> is a number from 0 to 5 with one decimal, <code>rating.count<\/code> is the number of reviews", "<code>swatches<\/code> are hex colours, one per colour the product comes in", "<code>data-prompt<\/code> is the follow-up query the element sends when clicked; write it as a short user request", "Product <code>data-prompt<\/code> is always <code>Show product &lt;title&gt;<\/code>", "Category and subcategory <code>data-prompt<\/code> is always <code>Show category &lt;category&gt;<\/code>", "<code>anchor<\/code> scrolls to another section on the same page; it is that section's <code>section_id<\/code> and sends no query", "Add to bag, quantity, remove, wishlist hearts, compare checkboxes, sort and filter controls, forms and Pay buttons are frontend actions: send no <code>data-prompt<\/code> for them", "Frame components (announcement, header, mobile menu, footer) are sent once per session with the first response; never send them in reply to a later query", "Homepage order: Hero → Product Grid → Size → Editorial → Press → Trust; add or drop sections only when the user's query asks for it"], "raw": ["Every block sends full props: the frontend has no product data of its own, so titles, prices, images and ratings all come from you", "Use only STORE INFO for products, prices, sizes, ratings, reviews and quotes; never invent a product, price or review", "Use only CART INFO for bag contents and totals, SESSION INFO for recently viewed and compared products, and ORDER INFO for a placed order; the frontend sends these with the query, and you never invent or change them", "Prices are numbers in EUR without a currency sign, for example `139` or `24.9`", "Inside te : [\n    {\n      \"category\": \"checkout-section\",\n      \"name\": \"stride-checkout\",\n      \"props\": {\n        \"store\": \"Stride\",\n        \"delivery\": [\n          { \"id\": \"standard\", \"label\": \"Standard · 2–4 working days\", \"note\": \"DPD or GLS to your door\", \"price\": 0 },\n          { \"id\": \"pickup\", \"label\": \"Pickup point · 2–4 working days\", \"note\": \"Any DPD Pickup or Box\", \"price\": 0 },\n          { \"id\": \"express\", \"label\": \"Express · next working day\", \"note\": \"Order by 14:00, Croatia only\", \"price\": 9.9 }\n        ],\n        \"countries\": [\"Croatia\", \"Austria\", \"Germany\", \"Italy\", \"Netherlands\", \"Slovenia\", \"Other EU country\"],\n        \"lines\": [\n          { \"title\": \"Aero Run 2\", \"options\": [\"Signal Red / White\", \"EU 42\"], \"qty\": 1, \"price\": 139, \"image\": \"photo-1542291026-7eec264c27ff\" },\n          { \"title\": \"Merino run sock 3-pack\", \"options\": [\"39–42\"], \"qty\": 2, \"price\": 58, \"image\": \"photo-1773665230184-5fd8cb4fc928\" }\n        ],\n        \"subtotal\": 197,\n        \"shipping\": 0,\n        \"vat\": 39.4,\n        \"total\": 197,\n        \"payments\": [\"VISA\", \"MASTERCARD\", \"APPLE PAY\", \"GOOGLE PAY\", \"PAYPAL\", \"KLARNA\", \"SEPA\"]\n      }\n    }\n  ]\n}", "props": {"store": "Stride", "delivery": [{"id": "standard", "label": "Standard · 2–4 working days", "note": "DPD or GLS to your door", "price": 0}, {"id": "pickup", "label": "Pickup point · 2–4 working days", "note": "Any DPD Pickup or Box", "price": 0}, {"id": "express", "label": "Express · next working day", "note": "Order by 14:00, Croatia only", "price": 9.9}], "countries": ["Croatia", "Austria", "Germany", "Italy", "Netherlands", "Slovenia", "Other EU country"], "lines": [{"title": "Aero Run 2", "options": ["Signal Red / White", "EU 42"], "qty": 1, "price": 139, "image": "photo-1542291026-7eec264c27ff"}, {"title": "Merino run sock 3-pack", "options": ["39–42"], "qty": 2,     \"address\": \"Ilica 1, 10000 Zagreb, Croatia\",\n        \"lines\": [\n          { \"title\": \"Aero Run 2\", \"options\": [\"Signal Red / White\", \"EU 42\"], \"qty\": 1, \"price\": 139, \"image\": \"photo-1542291026-7eec264c27ff\" },\n          { \"title\": \"Merino run sock 3-pack\", \"options\": [\"39–42\"], \"qty\": 2, \"price\": 58, \"image\": \"photo-1773665230184-5fd8cb4fc928\" }\n        ],\n        \"subtotal\": 197,\n        \"shipping\": 0,\n        \"total\": 197,\n        \"method\": \"card\",\n        \"data-prompt\": \"Show the homepage\"\n      }\n    }\n  ]\n}", "props": {"order": "482913", "first-name": "Ana", "email": "ana@example.com", "eta": "2026-11-16", "address": "Ilica 1, 10000 Zagreb, Croatia", "lines": [{"title": "Aero Run 2", "options": ["Signal Red / White", "EU 42"], "qty": 1, "price": 139, "image": "photo-1542291026-7eec264c27ff"}, {"title": "Merino run sock 3-pack", "options": ["39–42"], "qty": 2, "price": 58, "image": "photo-1773665230184-5fd8cb4fc928"}], "subtotal": 197, "shipping": 0, "total": 197, "method": "card", "data-prompt": "Show the homepage"}, "error": null}], "problems": [], "layout": {"kind": "live"}}, {"id": "stride-toast", "title": "Stride Toast Section", "rules": ["Use only to confirm an action the frontend reports, such as added to bag, saved to wishlist or removed; never as an answer to a question", "Send it alone; the frontend shows it for four seconds at the bottom of the page and reads it to screen readers", "Keep the message between min 2 - max 8 words", "Keep the action between min 0 - max 1 item: a label of min 1 - max 2 words and a data-prompt, for example <code>Show my bag<\/code>"], "raw": ["Use only to confirm an action the frontend reports, such as added to bag, saved to wishlist or removed; never as an answer to a question", "Send it alone; the frontend shows it for four seconds at the bottom of the page and reads it to screen readers", "Keep the message between min 2 - max 8 words", "Keep the action between min 0 - max 1 item: a label of min 1 - max 2 words and a data-prompt, for example `Show my bag`"], "notes": [], "variants": [{"label": "Default", "code": "{\n  \"section_id\": \"section-s47\",\n  \"components\": [\n    {\n      \"category\": \"toast-section\",\n      \"name\": \"stride-toast\",\n      \"props\": {\n        \"message\": \"Added to bag · Aero Run 2\",\n        \"action\": { \"label\": \"View bag\", \"data-prompt\": \"Show my bag\" }\n      }\n    }\n  ]\n}", "props": {"message": "Added to bag · Aero Run 2", "action": {"label": "View bag", "data-prompt": "Show my bag"}}, "error": null}], "problems": [], "layout": {"kind": "live"}}], "export": {"name": "webshop-components.md", "md": "# Stride UI components · rulesets and JSON\n\n## Shared rules\n\n- Every block sends full props: the frontend has no product data of its own, so titles, prices, images and ratings all come from you\n- Use only STORE INFO for products, prices, sizes, ratings, reviews and quotes; never invent a product, price or review\n- Use only CART INFO for bag contents and totals, SESSION INFO for recently viewed and compared products, and ORDER INFO for a placed order; the frontend sends these with the query, and you never invent or change them\n- Prices are numbers in EUR without a currency sign, for example `139` or `24.9`\n- Inside text, write amounts the way the store shows them: `€75`, `€4,90`\n- Send `compare-at` only when the product is on sale, and only when it is higher than `price`\n- Images are Unsplash photo ids from STORE INFO (for example `photo-1542291026-7eec264c27ff`) or full `https://` URLs\n- `badges` only take these values: `new`, `bestseller`, `sale`, `low-stock`, `sold-out`\n- `rating.avg` is a number from 0 to 5 with one decimal, `rating.count` is the number of reviews\n- `swatches` are hex colours, one per colour the product comes in\n- `data-prompt` is the follow-up query the element sends when clicked; write it as a short user request\n- Product `data-prompt` is always `Show product <title>`\n- Category and subcategory `data-prompt` is always `Show category <category>`\n- `anchor` scrolls to another section on the same page; it is that section's `section_id` and sends no query\n- Add to bag, quantity, remove, wishlist hearts, compare checkboxes, sort and filter controls, forms and Pay buttons are frontend actions: send no `data-prompt` for them\n- Frame components (announcement, header, mobile menu, footer) are sent once per session with the first response; never send them in reply to a later query\n- Homepage order: Hero → Product Grid → Size → Editorial → Press → Trust; add or drop sections only when the user's query asks for it\n\n## Stride Announcement Section\n\n`stride-announcement`\n\n**Ruleset:**\n\n- Frame component: send it once per session in the first response, as the first component, above `stride-header`\n- Never send it in reply to a later query\n- Build the text only from STORE INFO shipping, returns and VAT facts\n- Keep the text between min 4 - max 14 words, with min 1 - max 3 promises separated by ` · `\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-s1\",\n  \"components\": [\n    {\n      \"category\": \"announcement-section\",\n      \"name\": \"stride-announcement\",\n      \"props\": {\n        \"text\": \"Free shipping over €75 · 30-day free returns · VAT included\"\n      }\n    }\n  ]\n}\n```\n\n## Stride Header Section\n\n`stride-header`\n\n**Ruleset:**\n\n- Frame component: send it once per session in the first response, after `stride-announcement` and before the first section\n- Never send it in reply to a later query; the frontend keeps it sticky on every page\n- Keep the logo as the store name from STORE INFO\n- Keep the nav between min 3 - max 7 items, in STORE INFO order\n- Keep the nav label between min 1 - max 2 words\n- Send `children` only for nav items that have subcategories in STORE INFO, min 2 - max 6 items; the frontend adds an `All <label>` link and opens them as a mega menu on hover\n- Keep the children label between min 1 - max 2 words\n- Send `promo` only on nav items with children: one subcategory with its STORE INFO image, label min 1 - max 2 words\n- Search, store switcher, theme toggle, wishlist and bag icons are static; the frontend handles them\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-s2\",\n  \"components\": [\n    {\n      \"category\": \"header-section\",\n      \"name\": \"stride-header\",\n      \"props\": {\n        \"logo\": \"Stride\",\n        \"nav\": [\n          {\n            \"label\": \"Running\",\n            \"data-prompt\": \"Show category Running\",\n            \"children\": [\n              { \"label\": \"Road\", \"data-prompt\": \"Show category Road\" },\n              { \"label\": \"Trail\", \"data-prompt\": \"Show category Trail\" },\n              { \"label\": \"Track\", \"data-prompt\": \"Show category Track\" }\n            ],\n            \"promo\": { \"label\": \"Trail\", \"image\": \"photo-1718248028293-934f04a578db\", \"data-prompt\": \"Show category Trail\" }\n          },\n          { \"label\": \"Training\", \"data-prompt\": \"Show category Training\" },\n          { \"label\": \"Football\", \"data-prompt\": \"Show category Football\" },\n          { \"label\": \"Outdoor\", \"data-prompt\": \"Show category Outdoor\" },\n          { \"label\": \"Fan gear\", \"data-prompt\": \"Show category Fan gear\" },\n          { \"label\": \"Sale\", \"data-prompt\": \"Show category Sale\" }\n        ]\n      }\n    }\n  ]\n}\n```\n\n## Stride Search Suggest Section\n\n`stride-search-suggest`\n\n**Ruleset:**\n\n- Use when the user's message is a short, partial or misspelled product search of min 1 - max 3 words, for example `runing`; for a full search sentence send `stride-product-grid` instead\n- Send it alone; the frontend shows it as a dropdown under the search field\n- Match only STORE INFO titles, subtitles, category names and colour names; correct the spelling silently\n- Keep the query as the user's text, unchanged\n- Keep the categories between min 0 - max 3 items, label as the category name\n- Keep the products between min 0 - max 5 items, best match first, subtitle min 2 - max 6 words\n- Send empty `categories` and `products` when nothing matches; the frontend shows a \"No matches\" line\n- Keep the data-prompt as `Search <corrected query>`; it is sent by the \"All results\" link and by Enter\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-s3\",\n  \"components\": [\n    {\n      \"category\": \"search-section\",\n      \"name\": \"stride-search-suggest\",\n      \"props\": {\n        \"query\": \"runing\",\n        \"data-prompt\": \"Search running\",\n        \"categories\": [\n          { \"label\": \"Running\", \"data-prompt\": \"Show category Running\" }\n        ],\n        \"products\": [\n          { \"title\": \"Aero Run 2\", \"subtitle\": \"Neutral road running shoe\", \"price\": 139, \"image\": \"photo-1542291026-7eec264c27ff\", \"data-prompt\": \"Show product Aero Run 2\" },\n          { \"title\": \"Aero Stable\", \"subtitle\": \"Supportive road shoe for overpronators\", \"price\": 149, \"image\": \"photo-1571008887538-b36bb32f4571\", \"data-prompt\": \"Show product Aero Stable\" },\n          { \"title\": \"Trail Max GTX\", \"subtitle\": \"Waterproof trail running shoe\", \"price\": 179, \"image\": \"photo-1617179395455-101d786b4b7d\", \"data-prompt\": \"Show product Trail Max GTX\" },\n          { \"title\": \"Merino run sock 3-pack\", \"subtitle\": \"Cushioned ankle sock\", \"price\": 29, \"image\": \"photo-1773665230184-5fd8cb4fc928\", \"data-prompt\": \"Show product Merino run sock 3-pack\" }\n        ]\n      }\n    }\n  ]\n}\n```\n\n## Stride Mobile Menu Section\n\n`stride-mobile-menu`\n\n**Ruleset:**\n\n- Frame component: send it once per session in the first response, right after `stride-header`; the frontend opens it from the menu button on phones\n- Never send it in reply to a later query\n- Keep the nav identical to the `stride-header` nav: same labels, order and data-prompts, max 7 items\n- Send `children` exactly as in `stride-header`; the frontend lists them under their parent\n- Send no `promo`; the wishlist link and store switcher are static\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-s4\",\n  \"components\": [\n    {\n      \"category\": \"menu-section\",\n      \"name\": \"stride-mobile-menu\",\n      \"props\": {\n        \"nav\": [\n          {\n            \"label\": \"Running\",\n            \"data-prompt\": \"Show category Running\",\n            \"children\": [\n              { \"label\": \"Road\", \"data-prompt\": \"Show category Road\" },\n              { \"label\": \"Trail\", \"data-prompt\": \"Show category Trail\" },\n              { \"label\": \"Track\", \"data-prompt\": \"Show category Track\" }\n            ]\n          },\n          { \"label\": \"Training\", \"data-prompt\": \"Show category Training\" },\n          { \"label\": \"Football\", \"data-prompt\": \"Show category Football\" },\n          { \"label\": \"Outdoor\", \"data-prompt\": \"Show category Outdoor\" },\n          { \"label\": \"Fan gear\", \"data-prompt\": \"Show category Fan gear\" },\n          { \"label\": \"Sale\", \"data-prompt\": \"Show category Sale\" }\n        ]\n      }\n    }\n  ]\n}\n```\n\n## Stride Footer Section\n\n`stride-footer`\n\n**Ruleset:**\n\n- Frame component: send it once per session in the first response, as the last component; the frontend keeps it at the bottom of every page\n- Never send it in reply to a later query\n- Keep the logo as the store name and the tagline as the STORE INFO tagline, min 6 - max 16 words\n- Keep the newsletter label between min 3 - max 7 words and the newsletter hint between min 6 - max 14 words; the email field and Join button are static\n- Keep the columns to exactly 3 items, titled `Shop`, `Help` and `Company`, each with min 2 - max 6 links\n- Keep the Shop links as the first min 3 - max 5 `stride-header` nav items, with the same data-prompts\n- Keep the Help and Company link labels between min 1 - max 3 words; the data-prompt asks for that page, for example `Show shipping and returns`\n- Keep the payments as the STORE INFO payment names in capitals, min 3 - max 8 items\n- Keep the legal as `© <year> <store> d.o.o. · <city> · <note>`, min 5 - max 14 words\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-s5\",\n  \"components\": [\n    {\n      \"category\": \"footer-section\",\n      \"name\": \"stride-footer\",\n      \"props\": {\n        \"logo\": \"Stride\",\n        \"tagline\": \"Footwear and sport gear, shipped from Zagreb to the whole EU.\",\n        \"newsletter\": { \"label\": \"Get 10% off your first order\", \"hint\": \"One email a week at most. Unsubscribe any time.\" },\n        \"columns\": [\n          {\n            \"title\": \"Shop\",\n            \"links\": [\n              { \"label\": \"Running\", \"data-prompt\": \"Show category Running\" },\n              { \"label\": \"Training\", \"data-prompt\": \"Show category Training\" },\n              { \"label\": \"Football\", \"data-prompt\": \"Show category Football\" },\n              { \"label\": \"Outdoor\", \"data-prompt\": \"Show category Outdoor\" },\n              { \"label\": \"Fan gear\", \"data-prompt\": \"Show category Fan gear\" }\n            ]\n          },\n          {\n            \"title\": \"Help\",\n            \"links\": [\n              { \"label\": \"Shipping & returns\", \"data-prompt\": \"Show shipping and returns\" },\n              { \"label\": \"Size guide\", \"data-prompt\": \"Show the size guide\" },\n              { \"label\": \"Track order\", \"data-prompt\": \"How do I track my order?\" },\n              { \"label\": \"Contact\", \"data-prompt\": \"How can I contact you?\" }\n            ]\n          },\n          {\n            \"title\": \"Company\",\n            \"links\": [\n              { \"label\": \"About\", \"data-prompt\": \"Tell me about Stride\" },\n              { \"label\": \"Sustainability\", \"data-prompt\": \"What do you do for sustainability?\" },\n              { \"label\": \"Press\", \"data-prompt\": \"What does the press say about you?\" }\n            ]\n          }\n        ],\n        \"payments\": [\"VISA\", \"MASTERCARD\", \"APPLE PAY\", \"GOOGLE PAY\", \"PAYPAL\", \"KLARNA\", \"SEPA\"],\n        \"legal\": \"© 2026 Stride d.o.o. · Zagreb · Prototype, no real orders\"\n      }\n    }\n  ]\n}\n```\n\n## Stride Hero Section\n\n`stride-hero`\n\n**Ruleset:**\n\n- Use when the page (components array) is empty, or when the user asks for the homepage; always place it first, after the frame components on the first response\n- Follow it with the homepage order from Shared rules: Product Grid → Size → Editorial → Press → Trust\n- Never send it together with `stride-hero-campaign`, `stride-hero-slider` or `stride-hero-product`\n- The hero and the category tiles are one block: always send them together\n- Keep the eyebrow between min 1 - max 3 words\n- Keep the title between min 3 - max 7 words\n- Keep the text between min 8 - max 20 words\n- Keep the image as one landscape photo id from STORE INFO\n- Keep the cta label between min 1 - max 3 words\n- Keep the cta data-prompt as `Show category <category>` or `Show product <title>`\n- Keep the tiles between min 2 - max 6 items, one per top-level category\n- Keep the tiles label to the category name, min 1 - max 2 words\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-s6\",\n  \"components\": [\n    {\n      \"category\": \"hero-section\",\n      \"name\": \"stride-hero\",\n      \"props\": {\n        \"eyebrow\": \"Trail season\",\n        \"title\": \"Built for the long way round\",\n        \"text\": \"Waterproof trail shoes, merino socks and gaiters, in stock and shipping today.\",\n        \"image\": \"photo-1718248028293-934f04a578db\",\n        \"cta\": { \"label\": \"Shop trail\", \"data-prompt\": \"Show category Trail\" },\n        \"tiles\": [\n          { \"label\": \"Running\", \"image\": \"photo-1590333748338-d629e4564ad9\", \"data-prompt\": \"Show category Running\" },\n          { \"label\": \"Training\", \"image\": \"photo-1517836357463-d25dfeac3438\", \"data-prompt\": \"Show category Training\" },\n          { \"label\": \"Football\", \"image\": \"photo-1689785280879-98b0fb52084d\", \"data-prompt\": \"Show category Football\" },\n          { \"label\": \"Outdoor\", \"image\": \"photo-1600100315778-850119b19220\", \"data-prompt\": \"Show category Outdoor\" }\n        ]\n      }\n    }\n  ]\n}\n```\n\n## Stride Hero Campaign Section\n\n`stride-hero-campaign`\n\n**Ruleset:**\n\n- Use as the first section of a campaign or seasonal homepage, or when the user asks to shop a look, for example `What do I wear for a wet trail run?`\n- Never send it together with another hero; it can be followed by `stride-edit` or `stride-product-grid`\n- Keep the eyebrow between min 1 - max 4 words\n- Keep the title between min 3 - max 7 words\n- Keep the text between min 8 - max 20 words\n- Keep the image as one landscape photo id from STORE INFO that shows the tagged products\n- Keep the cta label between min 1 - max 4 words and the cta data-prompt as `Show category <category>`\n- Keep the hotspots between min 2 - max 4 items, one per STORE INFO product visible in the image\n- Keep the hotspot `x` and `y` as whole numbers from 5 to 95: the dot's position in percent from the image's left and top edge\n- Each hotspot opens a small card with the product's title, price and image; keep its data-prompt as `Show product <title>`\n- The \"Tap a dot\" hint is static\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-s7\",\n  \"components\": [\n    {\n      \"category\": \"hero-section\",\n      \"name\": \"stride-hero-campaign\",\n      \"props\": {\n        \"eyebrow\": \"Wet weather kit\",\n        \"title\": \"Rain is just more trail\",\n        \"text\": \"A waterproof shoe, a gaiter that keeps the grit out and a cap that packs away.\",\n        \"image\": \"photo-1718248028293-934f04a578db\",\n        \"cta\": { \"label\": \"Shop the kit\", \"data-prompt\": \"Show category Trail\" },\n        \"hotspots\": [\n          { \"x\": 34, \"y\": 72, \"title\": \"Trail Max GTX\", \"price\": 179, \"image\": \"photo-1617179395455-101d786b4b7d\", \"data-prompt\": \"Show product Trail Max GTX\" },\n          { \"x\": 46, \"y\": 58, \"title\": \"Trail gaiter\", \"price\": 29, \"image\": \"photo-1655976795374-6b519928f1e1\", \"data-prompt\": \"Show product Trail gaiter\" },\n          { \"x\": 62, \"y\": 22, \"title\": \"Run cap\", \"price\": 25, \"image\": \"photo-1758922769578-68c5ba000d87\", \"data-prompt\": \"Show product Run cap\" }\n        ]\n      }\n    }\n  ]\n}\n```\n\n## Stride Hero Slider Section\n\n`stride-hero-slider`\n\n**Ruleset:**\n\n- Use as the first section when the store has two or three equal promotions, or when the user asks what's new or on offer\n- Never send it together with another hero\n- Slides never auto-advance; the frontend adds arrows, dots and swipe\n- Keep the slides between min 2 - max 3 items, the most important first\n- Keep the slide eyebrow between min 1 - max 2 words\n- Keep the slide title between min 3 - max 6 words\n- Keep the slide text between min 5 - max 12 words\n- Keep the slide image as one landscape photo id from STORE INFO\n- Keep the slide cta label between min 2 - max 4 words and its data-prompt as `Show product <title>` or `Show category <category>`\n- Keep the tiles to exactly 4 items, label as the category name, min 1 - max 2 words\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-s8\",\n  \"components\": [\n    {\n      \"category\": \"hero-section\",\n      \"name\": \"stride-hero-slider\",\n      \"props\": {\n        \"slides\": [\n          {\n            \"eyebrow\": \"Trail season\",\n            \"title\": \"Built for the long way\",\n            \"text\": \"Waterproof shoes, merino socks and gaiters, shipping today.\",\n            \"image\": \"photo-1718248028293-934f04a578db\",\n            \"cta\": { \"label\": \"Shop trail shoes\", \"data-prompt\": \"Show category Trail\" }\n          },\n          {\n            \"eyebrow\": \"Price drop\",\n            \"title\": \"Strike FG, now €119\",\n            \"text\": \"Our firm-ground boot, down from €149 while stock lasts.\",\n            \"image\": \"photo-1529900748604-07564a03e7a6\",\n            \"cta\": { \"label\": \"Shop Strike FG\", \"data-prompt\": \"Show product Strike FG\" }\n          },\n          {\n            \"eyebrow\": \"New\",\n            \"title\": \"One shoe for the gym\",\n            \"text\": \"Flux Trainer: flat, stable and grippy for lifts and circuits.\",\n            \"image\": \"photo-1606107557195-0e29a4b5b4aa\",\n            \"cta\": { \"label\": \"See Flux Trainer\", \"data-prompt\": \"Show product Flux Trainer\" }\n          }\n        ],\n        \"tiles\": [\n          { \"label\": \"Running\", \"image\": \"photo-1590333748338-d629e4564ad9\", \"data-prompt\": \"Show category Running\" },\n          { \"label\": \"Training\", \"image\": \"photo-1517836357463-d25dfeac3438\", \"data-prompt\": \"Show category Training\" },\n          { \"label\": \"Football\", \"image\": \"photo-1689785280879-98b0fb52084d\", \"data-prompt\": \"Show category Football\" },\n          { \"label\": \"Sale\", \"image\": \"photo-1542291026-7eec264c27ff\", \"data-prompt\": \"Show category Sale\" }\n        ]\n      }\n    }\n  ]\n}\n```\n\n## Stride Hero Product Section\n\n`stride-hero-product`\n\n**Ruleset:**\n\n- Use when the user wants everything about one flagship product on a single long page, for example `Tell me everything about the Trail Max GTX`; for a normal product page send `stride-product` instead\n- Send `stride-chapter-nav` before it; after it send any of `stride-chapter`, `stride-specs`, `stride-reviews`, `stride-faq`, `stride-final-cta` and `stride-sticky-atc`, in that order\n- Keep the eyebrow as the product name, min 1 - max 3 words\n- Keep the title as a promise, not the product name, min 2 - max 6 words\n- Keep the text between min 10 - max 25 words\n- Keep the images between min 2 - max 5 items; the first one is the main image\n- Keep the colors between min 1 - max 6 items, each with a label and a hex value\n- Keep the sizes as every size the product comes in; send `available: false` for sizes out of stock\n- Keep the key-specs between min 3 - max 5 items; each is a `[label, value]` pair, label min 1 - max 2 words, value min 1 - max 5 words\n- The stock line, quantity, Add to bag, express pay buttons and the delivery, returns and VAT strip are static; the frontend builds them from STORE INFO\n\n**JSON:**\n\n```json\n{\n  \"section_id\": \"section-s9\",\n  \"components\": [\n    {\n      \"category\": \"hero-section\",\n      \"name\": \"stride-hero-product\",\n      \"props\": {\n        \"eyebrow\": \"Trail Max GTX\",\n        \"title\": \"Dry feet. Any trail.\",\n        \"text\": \"A waterproof membrane, 5 mm lugs and a rock plate, for runs that don't stay on the path.\",\n        \"product\": \"Trail Max GTX\",\n        \"price\": 179,\n        \"badges\": [\"bestseller\"],\n        \"rating\": { \"avg\": 4.6, \"count\": 97 },\n        \"images\": [\"photo-1617179395455-101d786b4b7d\", \"photo-1718248028293-934f04a578db\", \"photo-1530143311094-34d807799e8f\"],\n        \"colors\": [\n          { \"label\": \"Ember / Black\", \"hex\": \"#f26a21\" },\n          { \"label\": \"Olive\", \"hex\": \"#5e6b3f\" }\n        ],\n        \"sizes\": [\n          { \"label\": \"39\", \"available\": true },\n          { \"label\": \"40\", \"available\": true },\n          { \"label\": \"41\", \"available\": false },\n          { \"label\": \"42\", \"available\": true },\n          { \"label\": \"43\", \"available\": true },\n          { \"label\": \"44\", \"available\": true },\n          { \"label\": \"45\", \"available\": true },\n          { \"label\": \"46\", \"ava
